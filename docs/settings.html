<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Team Settings</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: -apple-system, Arial, sans-serif; max-width: 560px; margin: 0 auto; padding: 30px; color: #222; }
  h2 { margin-bottom: 4px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 20px; }
  select { padding: 6px 10px; font-size: 14px; margin-bottom: 20px; border-radius: 6px; border: 1px solid #ccc; }
  .team-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #eee; }
  .team-row .espn-name { flex: 1; color: #777; font-size: 13px; }
  .team-row input[type="text"] { flex: 1; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; }
  .team-row input[type="color"] { width: 40px; height: 32px; border: 1px solid #ccc; border-radius: 4px; padding: 2px; }
  .team-row input:disabled, .team-row input[type="color"]:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Logo upload -- a square button that IS the preview, so clicking the
     logo itself (or its placeholder) is what opens the file picker,
     rather than a separate "choose file" control sitting next to it. */
  .logo-cell { position: relative; flex: none; }
  .logo-upload-btn {
    width: 44px; height: 44px; border-radius: 8px; border: 1px solid #ccc;
    background: #f5f5f5; padding: 0; overflow: hidden; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .logo-upload-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .logo-upload-btn:hover:not(:disabled) { border-color: #1a3fa0; }
  .logo-preview { width: 100%; height: 100%; object-fit: cover; display: block; }
  .logo-fallback { width: 100%; height: 100%; align-items: center; justify-content: center; font-size: 18px; color: #999; }
  .logo-remove-btn {
    position: absolute; top: -6px; right: -6px; width: 18px; height: 18px;
    border-radius: 50%; border: 1px solid #ccc; background: #fff; color: #a04000;
    font-size: 12px; line-height: 1; padding: 0; cursor: pointer;
  }
  .logo-remove-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #savedNote { font-size: 12px; color: #888; height: 18px; margin-top: 10px; }
  a.back { display: block; margin-top: 24px; font-size: 13px; color: #1a3fa0; }
  #lockNote {
    font-size: 13px; color: #a04000; background: #fff6ec; border: 1px solid #ffe0b2;
    border-radius: 6px; padding: 10px 14px; margin-bottom: 18px; display: flex;
    align-items: center; justify-content: space-between; gap: 10px;
  }
  #unlockBtn {
    font-size: 13px; padding: 5px 12px; border-radius: 5px; border: 1px solid #a04000;
    background: #fff; color: #a04000; cursor: pointer;
  }
  #unlockBtn:hover { background: #fff0e0; }
</style>
</head>
<body>
  <h2>Team Colors & Names</h2>
  <div class="sub">Set once per team -- every week's matchup chart for this league reuses these automatically.</div>

  <div id="lockNote">
    <span id="lockText">🔒 Locked -- enter the PIN to edit</span>
    <button id="unlockBtn">Unlock</button>
  </div>

  <select id="leagueSelect"></select>
  <div id="teamList"></div>
  <div id="savedNote"></div>

  <h2 style="margin-top:36px">Season Results</h2>
  <div class="sub">Used by Year in Review, once the season (and any playoffs) are actually decided. Leave blank until then.</div>
  <div id="seasonResultsPanel">
    <label style="display:block;margin-bottom:10px">
      Year: <select id="resultsYearSelect"></select>
    </label>
    <label style="display:block;margin-bottom:6px">🥇 1st place: <select class="podium-select" data-place="1"></select></label>
    <label style="display:block;margin-bottom:6px">🥈 2nd place: <select class="podium-select" data-place="2"></select></label>
    <label style="display:block;margin-bottom:14px">🥉 3rd place: <select class="podium-select" data-place="3"></select></label>
    <label style="display:block;margin-bottom:14px">
      Playoff spots (how many teams made the playoffs):
      <input type="number" id="playoffSpotsInput" min="1" max="20" style="width:60px">
    </label>
    <button id="saveSeasonResultsBtn" type="button">Save Season Results</button>
  </div>

  <a class="back" href="index.html">&larr; Back to charts</a>

<script src="config.js"></script>
<script src="settings.js?v=4"></script>
</body>
</html>
