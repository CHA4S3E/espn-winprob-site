<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Display Settings — Fantasy Win Probability</title>
<script>
  document.documentElement.setAttribute(
    'data-theme',
    localStorage.getItem('winProbTheme') ||
      (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
  );
</script>
<style>
  :root {
    --bg: #ffffff;
    --fg: #222222;
    --muted: #888888;
    --border: #eeeeee;
    --card-bg: #ffffff;
    --accent: #1a3fa0;
  }
  html[data-theme="dark"] {
    --bg: #14161a;
    --fg: #e8e8e8;
    --muted: #9aa0a6;
    --border: #2a2d33;
    --card-bg: #1c1f24;
    --accent: #3a67df;
  }

  body { font-family: -apple-system, Arial, sans-serif; background: var(--bg); margin: 0; padding: 30px; color: var(--fg); }
  #wrap { max-width: 480px; margin: 0 auto; }
  h2 { margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 26px; }

  .setting-group {
    border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; background: var(--card-bg);
    margin-bottom: 16px;
  }
  .setting-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .setting-desc { font-size: 12px; color: var(--muted); margin-bottom: 12px; }

  .option-row {
    display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; cursor: pointer;
  }
  .option-row input { margin-top: 3px; }
  .option-label { font-size: 13px; }
  .option-example { font-size: 11px; color: var(--muted); margin-top: 2px; }

  a.back-link { display: inline-block; margin-top: 8px; font-size: 13px; color: var(--accent); text-decoration: none; }
  a.back-link:hover { text-decoration: underline; }
</style>
</head>
<body>
<div id="wrap">
  <h2>Display Settings</h2>
  <div class="sub">These are saved on this device and apply next time you load the main page.</div>

  <div class="setting-group">
    <div class="setting-title">Chart tooltip detail</div>
    <div class="setting-desc">What shows up when you hover a point on a Timeline or Postcard chart.</div>

    <label class="option-row">
      <input type="radio" name="tooltipDetail" value="condensed">
      <span>
        <div class="option-label">Condensed (default)</div>
        <div class="option-example">Just the win percentage, e.g. "Joe Buck Yourself: 73%"</div>
      </span>
    </label>

    <label class="option-row">
      <input type="radio" name="tooltipDetail" value="full">
      <span>
        <div class="option-label">Full detail</div>
        <div class="option-example">Win percentage plus each team's actual and projected score at that moment</div>
      </span>
    </label>
  </div>

  <a class="back-link" href="index.html">&larr; Back to matchups</a>
</div>

<script>
  const KEY = 'winProbTooltipDetail';
  const radios = document.querySelectorAll('input[name="tooltipDetail"]');
  const current = localStorage.getItem(KEY) || 'condensed';
  radios.forEach((r) => {
    r.checked = r.value === current;
    r.addEventListener('change', () => {
      if (r.checked) localStorage.setItem(KEY, r.value);
    });
  });
</script>
</body>
</html>
