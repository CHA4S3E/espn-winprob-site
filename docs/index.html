<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Fantasy Win Probability Tracker</title>
<!-- Controls the color of the browser's OWN UI chrome on mobile (the
     status bar area, and on some browsers the overscroll/bounce region)
     -- entirely separate from any CSS background on html/body, and the
     reason a plain CSS fix for the overscroll area alone didn't resolve
     the black flash people were seeing above the leader gradient. Content
     gets updated dynamically below (before first paint) and again
     whenever the theme toggle changes it (see setTheme in app.js), so it
     always matches whichever theme is actually active rather than a
     static value that could mismatch a manually-toggled theme. -->
<meta name="theme-color" content="#ffffff" id="themeColorMeta">
<!-- Inline SVG data URI rather than a hosted image file -- keeps the
     favicon self-contained in this one file, matching how the rest of
     the site avoids separate asset files. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8F%88</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doppio+One&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Set the theme attribute before first paint, so there's no flash of the
  // wrong theme while app.js (loaded at the bottom of the page) is still
  // starting up. Also sets the theme-color meta tag to match, for the
  // same reason -- otherwise the browser's own chrome briefly shows
  // whatever the tag's static fallback is before app.js gets a chance to
  // correct it.
  const initialTheme =
    localStorage.getItem('winProbTheme') ||
    (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', initialTheme);
  document.getElementById('themeColorMeta').setAttribute('content', initialTheme === 'dark' ? '#14161a' : '#ffffff');
  if (localStorage.getItem('winProbReduceMotion') === 'true') {
    document.documentElement.setAttribute('data-reduce-motion', 'true');
  }
</script>
<style>
  /* Always reserve space for the vertical scrollbar, whether or not it's
     currently needed. Without this, any small content-height change (even
     one unrelated to charts, like a hover-triggered percentage text width
     change causing a reflow) can cross the threshold for needing a
     scrollbar, which then eats ~15-17px from the right edge of the
     viewport. Since this page's layout uses a fixed left offset (body
     padding) rather than a centered container, that width change only
     ever shows up on the right side -- exactly the "left edge stays put,
     right edge shrinks" symptom. Reserving the space permanently means it
     can never appear/disappear and shift anything.
  */
  html {
    scrollbar-gutter: stable; overflow-y: scroll;
    /* Without this, the overscroll/rubber-band area above the very top of
       the page (or below the bottom) falls back to the browser's own
       default background (usually white) rather than the theme's --bg --
       since that bounce area is painted using the <html> element's own
       background, not <body>'s, regardless of how far <body> otherwise
       fills the page. Most noticeable on mobile Safari, and especially
       jarring in dark mode where a flash of white briefly appears above
       the leader gradient when scrolling past the top. */
    background: var(--bg); transition: background 0.2s;
  }

  :root {
    --bg: #ffffff;
    --fg: #222222;
    --muted: #888888;
    --border: #eeeeee;
    --card-bg: #ffffff;
    --input-bg: #fafafa;
    --input-border: #cccccc;
    --btn-border: #dddddd;
    --btn-hover: #f5f5f5;
    --accent: #1a3fa0;
    --live: #c0392b;
    --live-glow-a: rgba(192, 57, 43, 0.45);
    --live-glow-b: rgba(192, 57, 43, 0.9);
    --upset: #e8590c;
    --upset-glow-a: rgba(232, 89, 12, 0.35);
    --upset-glow-b: rgba(232, 89, 12, 0.85);
    --accent-glow-a: rgba(26, 63, 160, 0.3);
    --accent-glow-b: rgba(26, 63, 160, 0.8);
    /* Distinct from --upset (an already-triggered alert) -- this is for
       "approaching but hasn't triggered yet," so it needs its own color
       rather than borrowing the active-alert one, or the two states
       would be visually indistinguishable. */
    --warn: #b8860b;
    /* Championship-week tier accents -- gold/silver-ish/bronze-ish reads
       for the ribbon badges, darkened here in light mode for contrast on
       a white card (see the dark-mode block below for the brighter
       versions used against dark cards). Independent of --accent/--upset
       since a tier ribbon needs to coexist with an active Upset Watch
       border on the same card without the two colors being confused for
       each other. */
    --tier-champ: #a67c00;
    --tier-third: #1f8a53;
    --tier-other: #5b6472;
    /* Halloween ground fog -- a grayish-violet haze (same family as the
       bat glow's purple, desaturated toward gray so it reads as fog/mist
       rather than another glow effect) needs more opacity here than in
       dark mode to stay visible against a white page without looking like
       a dirt smudge; #seasonalFog's own blur softens the hard gradient
       edges either way. */
    --fog-color: rgba(108, 96, 132, 0.4);
    /* Warm incandescent halo layered behind each Christmas bulb's own
       team-colored glow (see .seasonal-bulb) -- lower alpha here since a
       warm glow shows up more strongly against a light card background
       than it needs to. */
    --bulb-warm-glow: rgba(255, 179, 71, 0.35);
    /* Doppio One for team names/percentages/headings -- a display face
       that's already bold-by-design (it only ships in a single weight, no
       separate Bold variant, so display-font elements below deliberately
       don't request font-weight 600/700 -- there's nothing there for the
       browser to render, it would just silently fall back to the same
       400). Inter for anything read as prose. */
    --font-display: 'Doppio One', 'Arial Narrow', sans-serif;
    --font-body: 'Inter', -apple-system, Arial, sans-serif;
    --text-xs: 11px;
    --text-sm: 12px;
    --text-base: 14px;
    --text-lg: 16px;
    --text-xl: 20px;
    --text-2xl: 26px;
    --text-3xl: 34px;
  }
  html[data-theme="dark"] {
    --bg: #14161a;
    --fg: #e8e8e8;
    --muted: #9aa0a6;
    --border: #2a2d33;
    --card-bg: #1c1f24;
    --input-bg: #20232a;
    --input-border: #3a3d44;
    --btn-border: #3a3d44;
    --btn-hover: #262a31;
    --accent: #3a67df;
    --live: #e0574a;
    --live-glow-a: rgba(224, 87, 74, 0.5);
    --live-glow-b: rgba(224, 87, 74, 1);
    --upset: #ff8a3d;
    --upset-glow-a: rgba(255, 138, 61, 0.4);
    --upset-glow-b: rgba(255, 138, 61, 0.9);
    --accent-glow-a: rgba(58, 103, 223, 0.35);
    --accent-glow-b: rgba(58, 103, 223, 0.9);
    --warn: #e0a33e;
    --tier-champ: #f4c430;
    --tier-third: #4fd493;
    --tier-other: #9aa3af;
    /* Lighter and slightly less opaque than the light-mode fog -- a dark
       page needs less contrast to read the same haze, and too much here
       would just look like a gray wash over everything. */
    --fog-color: rgba(176, 164, 205, 0.24);
    /* A bit brighter/warmer than light mode's -- reads well against a dark
       card without needing as much saturation to stand out. */
    --bulb-warm-glow: rgba(255, 200, 120, 0.45);
  }

  /* Highlighted/selected text uses the theme's own accent color rather
     than the browser default blue -- automatically swaps between light
     and dark mode's accent since it reads the same --accent variable
     everything else on the page already uses. */
  ::selection { background: var(--accent); color: #fff; }
  ::-moz-selection { background: var(--accent); color: #fff; }

  body { font-family: var(--font-body); background: var(--bg); margin: 0; padding: 30px; color: var(--fg); transition: background 0.2s, color 0.2s; }

  /* Full-page seasonal particle field (falling leaves / falling snow) --
     fixed so it covers the viewport regardless of scroll position, and
     sits behind every other element via z-index while still painting
     above the plain page background. pointer-events:none so it never
     intercepts clicks/hovers on anything underneath. Only animates while
     currentSeasonalTheme (app.js) is set -- see loadMatchups (which sets
     it from the real NFL schedule, or a debug toggle) and seasonalTick
     (the draw loop itself, including the reduced-motion check that stops
     it entirely). */
  #seasonalParticleCanvas {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    z-index: 0; pointer-events: none;
  }
  /* #wrap already sets position:relative + z-index:1 further down (see
     its main rule) which is enough to keep it painting above this fixed
     z-index:0 canvas -- no extra rule needed here. */

  /* Halloween ground fog -- a slow, low-contrast haze drifting along the
     bottom of the viewport, layered on top of the falling-bat particle
     field above (z-index 0) but still behind #wrap's content (z-index 1).
     Pure CSS rather than another canvas particle system: it's one soft
     blurred shape, not individual moving objects, so a couple of animated
     gradient layers are simpler and cheaper than driving it frame-by-frame
     in seasonalTick. Gated by the data-seasonal-theme attribute app.js
     sets alongside currentSeasonalTheme (see loadMatchups) -- opacity
     fades in/out with a transition instead of a hard display swap, so a
     theme change (or the debug toggle) doesn't pop in/out abruptly. */
  #seasonalFog {
    position: fixed; left: 0; right: 0; bottom: 0;
    height: 22vh; min-height: 140px; max-height: 260px;
    z-index: 0; pointer-events: none; overflow: hidden;
    opacity: 0; transition: opacity 1.4s ease;
  }
  html[data-seasonal-theme="halloween"] #seasonalFog { opacity: 1; }
  .fog-layer {
    position: absolute; top: 0; left: 0; height: 100%; width: 200%;
    background-repeat: repeat-x;
    filter: blur(8px);
  }
  .fog-layer-1 {
    background-image: radial-gradient(ellipse 60% 90% at 25% 100%, var(--fog-color) 0%, transparent 72%);
    background-size: 50% 100%;
    opacity: 0.55;
    animation: fogDrift 46s linear infinite;
  }
  .fog-layer-2 {
    background-image: radial-gradient(ellipse 50% 85% at 70% 100%, var(--fog-color) 0%, transparent 72%);
    background-size: 50% 100%;
    opacity: 0.4;
    animation: fogDrift 64s linear infinite reverse;
  }
  @keyframes fogDrift {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .fog-layer { animation: none !important; }
  }
  html[data-reduce-motion="true"] .fog-layer { animation: none !important; }
  /* Canvases default to display:inline, which reserves a few pixels of
     invisible "descender" space below them (same as an inline image) --
     any small reflow nearby (like percentage text changing width on hover)
     can cause the browser to recompute that gap, making the chart appear to
     nudge or shrink by a pixel or two. display:block removes it entirely. */
  canvas { display: block; }
  #wrap { max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }

  /* ---- Leader gradient wash -- an ambient background tint behind
     everything (note z-index:0, and #wrap above is explicitly given
     z-index:1 so all real content stacks above this), colored after
     whichever team currently has the most points in the selected week.
     Positioned absolutely against the page itself (not the viewport --
     no `fixed`, so it scrolls away normally rather than staying pinned),
     confined to roughly the top quarter of the viewport height and
     fading to fully transparent by the bottom of that band, so a long
     page (Timeline view especially, which can run very tall) just shows
     plain background color for everything below that -- it was never
     meant to tint the whole page, only announce itself near the top.
     Same two-layer crossfade technique as before: gradients can't be
     smoothly transitioned directly, so the outgoing color's layer fades
     out while the incoming one fades in. */
  #leaderGradient {
    position: absolute; top: 0; left: 0; right: 0; height: 25vh;
    z-index: 0; pointer-events: none; overflow: hidden;
  }
  .leader-gradient-layer {
    position: absolute; inset: 0; opacity: 0;
    transition: opacity 1.2s ease;
  }
  .leader-gradient-layer.visible { opacity: 1; }
  @media (prefers-reduced-motion: reduce) {
    .leader-gradient-layer { transition: none; }
  }

  h2 {
    text-align: center; margin-bottom: 4px; font-family: var(--font-display); font-weight: 400;
    font-size: var(--text-3xl); letter-spacing: 0.02em;
  }
  .sub { text-align: center; color: var(--muted); font-size: var(--text-sm); margin-bottom: 18px; }

  /* Deliberately distinct from the plain utility dropdowns below it --
     this is meant to feel like a once-a-year, "your Wrapped is ready"
     moment, not just another control alongside the league/year/week
     selectors. */
  #yearInReviewLink {
    display: block; width: fit-content; margin: 0 auto 20px; padding: 10px 22px;
    font-family: var(--font-display); font-weight: 400; font-size: var(--text-lg);
    color: #fff; text-decoration: none; border-radius: 24px;
    background: linear-gradient(135deg, var(--accent), #8a4fd6);
    box-shadow: 0 2px 12px var(--accent-glow-a, rgba(0,0,0,0.15));
  }
  /* The hidden attribute needs to win over the rule above -- an ID
     selector alone (specificity 1,0,0) beats the browser's own default
     [hidden] { display: none } (specificity 0,1,0), so without this,
     setting element.hidden = true in JS has no visible effect at all. */
  #yearInReviewLink[hidden] { display: none; }
  #yearInReviewLink:hover { filter: brightness(1.08); }

  #controls {
    display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; align-items: center;
  }
  select {
    padding: 6px 10px; font-size: 14px; border: 1px solid var(--input-border); border-radius: 6px;
    background: var(--input-bg); color: var(--fg);
  }

  #themeToggle {
    padding: 6px 12px; font-size: 13px; border: 1px solid var(--btn-border); border-radius: 20px;
    background: var(--card-bg); color: var(--fg); cursor: pointer;
  }
  #themeToggle:hover { background: var(--btn-hover); }

  #viewToggle {
    display: flex; justify-content: center; gap: 6px; margin-bottom: 22px;
  }
  .view-btn {
    padding: 6px 14px; font-size: 13px; border: 1px solid var(--btn-border); border-radius: 20px;
    background: var(--card-bg); color: var(--fg); cursor: pointer; transition: all 0.15s;
  }
  .view-btn:hover { background: var(--btn-hover); }
  .view-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  #status { text-align: center; color: var(--muted); font-size: 13px; margin: 10px 0; }
  /* A team with no matchup this week (a genuine bye, not a poller
     hiccup) would otherwise just silently not appear anywhere on the
     page, which looks identical to something being broken -- this makes
     that distinction explicit instead of leaving it ambiguous. */
  #byeWeekNote { text-align: center; color: var(--muted); font-size: 12px; font-style: italic; margin: 0 0 16px; }

  /* Only shown before the CURRENT/latest week's first kickoff (or, once
     that week is fully Final, before the NEXT week's first kickoff) --
     see updateKickoffCountdown in app.js. Hidden the rest of the time,
     including while browsing older weeks via the dropdowns. */
  #kickoffCountdown {
    position: relative;
    text-align: center; font-family: var(--font-display); font-weight: 400;
    font-size: var(--text-xl); color: var(--accent); margin: 0 auto 20px; max-width: 400px;
    padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--card-bg);
    font-variant-numeric: tabular-nums; transition: font-size 0.4s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    overflow: hidden;
  }
  /* Confined to the box (overflow:hidden above clips it to the rounded
     corners) -- a small seasonal particle field, separate from the
     full-page #seasonalParticleCanvas, so the countdown itself feels
     themed even in the days-before hint window, before the full-page
     effect and card decor are showing at all. See updateSeasonalHint in
     app.js. Sits behind the text via z-index. */
  #kickoffCountdown .cd-particle-canvas {
    position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0;
  }
  #kickoffCountdown .kickoff-label,
  #kickoffCountdown .kickoff-time,
  #kickoffCountdown .kickoff-seasonal-hint {
    position: relative; z-index: 1;
  }
  #kickoffCountdown .kickoff-label {
    display: block; font-family: var(--font-body); font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 4px;
    transition: opacity 0.4s ease;
  }
  /* One-line hint shown only in the days leading up to a seasonal theme
     week (see updateSeasonalHint) -- e.g. "Thanksgiving week is almost
     here". Never shown at the same time as the full theme (that only
     starts once the theme week itself does), so this and the tinted
     border below are the ONLY seasonal cue during that lead-up window. */
  #kickoffCountdown .kickoff-seasonal-hint {
    display: block; font-family: var(--font-body); font-size: 11px;
    color: var(--muted); margin-top: 6px; font-variant-numeric: normal;
  }
  #kickoffCountdown.seasonal-thanksgiving {
    border-color: #7a4a1a; box-shadow: 0 0 0 1px rgba(214,133,43,0.15), 0 0 18px rgba(214,133,43,0.08);
  }
  #kickoffCountdown.seasonal-christmas {
    border-color: #2c5f3e; box-shadow: 0 0 0 1px rgba(79,212,147,0.15), 0 0 18px rgba(200,40,40,0.10);
  }
  /* Halloween: a sickly purple/green tint, distinct from Thanksgiving's
     warm amber and Christmas's green/red. */
  #kickoffCountdown.seasonal-halloween {
    border-color: #5b2a86; box-shadow: 0 0 0 1px rgba(180,120,255,0.18), 0 0 18px rgba(120,200,90,0.10);
  }
  /* Starts pulsing once kickoff is within an hour (see tickKickoffCountdown
     in app.js, which toggles this class) -- same glow technique as Upset
     Watch and the Live badge, just using the accent color instead, so
     the imminent-kickoff signal reads as part of the same visual language
     as the rest of the site's "something worth noticing" cues. */
  @keyframes countdownPulse {
    0%, 100% { box-shadow: inset 0 0 0 1px var(--accent), 0 0 6px var(--accent-glow-a); }
    50% { box-shadow: inset 0 0 0 1px var(--accent), 0 0 16px var(--accent-glow-b); }
  }
  #kickoffCountdown.imminent { animation: countdownPulse 2.4s ease-in-out infinite; }

  /* The final 60 seconds get a deliberately bigger moment rather than
     treating the whole "within an hour" stretch identically -- larger
     text, a faster and stronger pulse, and the label fading back so the
     number itself is unmistakably the focal point. font-size transitions
     smoothly into place (see the base rule above) instead of snapping. */
  @keyframes countdownFinalPulse {
    0%, 100% { box-shadow: inset 0 0 0 1.5px var(--accent), 0 0 10px var(--accent-glow-a); }
    50% { box-shadow: inset 0 0 0 1.5px var(--accent), 0 0 30px var(--accent-glow-b); }
  }
  #kickoffCountdown.final-minute {
    font-size: calc(var(--text-xl) * 1.8);
    animation: countdownFinalPulse 0.9s ease-in-out infinite;
  }
  #kickoffCountdown.final-minute .kickoff-label { opacity: 0.6; }

  #recapBanner {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 20px 20px; margin: 0 auto 20px; max-width: 640px;
  }
  .recap-title {
    font-family: var(--font-display); font-weight: 400; font-size: var(--text-xl);
    letter-spacing: 0.02em; margin-bottom: 12px; text-align: center;
  }
  .recap-scores {
    margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border);
  }
  .recap-score-line { font-size: var(--text-sm); padding: 4px 0; display: flex; justify-content: space-between; gap: 10px; }
  .recap-score-line b { font-family: var(--font-display); font-weight: 400; }
  .recap-margin { font-family: var(--font-display); font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ---- Highlight cards -- one per stat, in a responsive layout rather
     than a stacked list of sentences. Each card is self-contained (label,
     headline value, supporting detail) so adding or removing a stat never
     requires rebalancing surrounding text, unlike the old sentence-based
     layout. Flexbox rather than CSS Grid specifically because Grid has no
     built-in way to center a ragged, incomplete final row -- a week where
     exactly 8 of the 9 possible cards apply (or any other count that
     doesn't divide evenly per row) would otherwise leave that last row
     left-aligned with an awkward empty gap on one side. Flex-wrap with
     justify-content:center handles that automatically. ---- */
  .recap-highlights {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
  }
  .recap-card {
    background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; flex: 1 1 180px; max-width: 220px;
  }
  .recap-card-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--muted); margin-bottom: 4px;
  }
  .recap-card-value { font-size: 13px; line-height: 1.3; }
  .recap-card-value b { font-family: var(--font-display); font-weight: 400; }
  .recap-card-sub { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.3; }
  /* The closing card (Upset/Threat/Near-Upset, or the Total Points
     fallback on an uneventful week) always gets its own full-width row
     and is centered within it -- flex-basis:100% forces it onto a row by
     itself since nothing else can fit alongside it, then max-width plus
     the parent's justify-content:center keeps it from stretching edge to
     edge. */
  .recap-card-featured { flex: 1 1 100%; max-width: 400px; margin: 0 auto; text-align: center; }

  /* ---- Live/Final status badges -- glow while genuinely live (all_starters_done
     is false, meaning the game could still move at any moment, even through a
     quiet scoring lull), plain gray once a matchup is Final. ---- */
  @keyframes liveGlow {
    0%, 100% { text-shadow: 0 0 3px var(--live-glow-a); }
    50% { text-shadow: 0 0 9px var(--live-glow-b), 0 0 3px var(--live-glow-a); }
  }
  /* ---- Upset Watch -- a per-card alert, not a banner. Pulses the card's
     own border and a centered badge together, using the same alert color
     for both so they read as one coordinated signal, kept noticeably
     calmer than the Live-badge glow above so it's attention-getting
     without competing with the chart itself. Uses box-shadow rather than
     changing border-width, so nothing in the card's layout ever shifts by
     even a pixel while it pulses. ---- */
  @keyframes upsetPulse {
    0%, 100% { box-shadow: inset 0 0 0 1px var(--upset), 0 0 6px var(--upset-glow-a); }
    50% { box-shadow: inset 0 0 0 1px var(--upset), 0 0 16px var(--upset-glow-b); }
  }
  @keyframes upsetTextPulse {
    0%, 100% { opacity: 0.8; text-shadow: 0 0 3px var(--upset-glow-a); }
    50% { opacity: 1; text-shadow: 0 0 8px var(--upset-glow-b); }
  }
  .upset-watch { animation: upsetPulse 2.4s ease-in-out infinite; }
  /* Height/line-height/margin are reserved unconditionally, whether or not
     the alert is currently active -- toggling only `visibility` (never
     `display`, and never rendered/removed via the `hidden` attribute)
     means the card's total height never changes when upset watch turns on
     or off, so sibling cards never shift position. The animation itself
     is gated on .pulsing so an inactive, invisible badge isn't still
     animating in the background for no reason. */
  .upset-watch-badge {
    text-align: center; font-family: var(--font-display); font-weight: 400;
    font-size: var(--text-sm); letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--upset); margin-bottom: 6px;
    height: 1.1em; line-height: 1.1em;
    visibility: hidden;
  }
  /* .visible and .pulsing are separate so a historical hover state (see
     app.js) can show the plain "Upset Watch was active here" text without
     any glow -- only the CURRENT live alert gets both classes together. */
  .upset-watch-badge.visible { visibility: visible; }
  .upset-watch-badge.pulsing {
    animation: upsetTextPulse 2.4s ease-in-out infinite;
  }

  /* ---- Delta popup -- a small "+X.X%"/"-X.X%" callout that appears next
     to a team's percentage ~500ms after a poll actually moves it, colored
     for whichever side gained ground, then fades after a few seconds.
     Modeled on election-night vote-margin-change callouts. Sits above the
     row via absolute positioning (see .espn-row/.fc-team-row position:
     relative) so it never affects layout, and toggling the .show class
     restarts the animation -- see scheduleDeltaBadge in app.js, which also
     forces a reflow before re-adding .show so back-to-back polls each get
     their own full run rather than the animation appearing to do nothing
     because the class was already present. Gated entirely on the
     "Win-probability change popups" preference (see preferences.html);
     when off, app.js never calls scheduleDeltaBadge at all. ---- */
  .delta-badge {
    position: absolute;
    right: 0;
    top: -4px;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    padding: 2px 8px;
    border-radius: 999px;
    color: #0b0d11;
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
    transform: translateY(-6px) scale(0.85);
    z-index: 2;
  }
  .delta-badge.show { animation: deltaPop 5s ease forwards; }
  @keyframes deltaPop {
    0% { opacity: 0; transform: translateY(-6px) scale(0.85); }
    8% { opacity: 1; transform: translateY(-16px) scale(1.08); }
    14% { transform: translateY(-16px) scale(1); }
    80% { opacity: 1; transform: translateY(-16px) scale(1); }
    100% { opacity: 0; transform: translateY(-22px) scale(0.92); }
  }
  /* Reduced motion keeps the badge (it's real information, same as the
     Upset Watch badge staying visible with just the pulse removed) but
     drops the pop-in bounce and drift, leaving a plain fade. */
  html[data-reduce-motion="true"] .delta-badge.show { animation: deltaPopReduced 5s ease forwards; }
  @keyframes deltaPopReduced {
    0% { opacity: 0; }
    8% { opacity: 1; }
    80% { opacity: 1; }
    100% { opacity: 0; }
  }

  @keyframes cardEnter {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  /* Applies to every card type across all four views. Only fires on a full
     rebuild (initial load, league/week change, view switch) -- the 30s
     background refresh updates existing card elements in place rather than
     recreating them, so this never replays on a routine data refresh, only
     when cards are genuinely new to the page. Staggered per card via
     nth-child so a page of several matchups cascades in rather than
     popping in all at once; capped at 10 steps since leagues rarely run
     much larger and any further stagger would just feel slow. */
  .matchup-card, .postcard, .needle-card, .espn-card {
    animation: cardEnter 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  #matchups > :nth-child(1) { animation-delay: 0.02s; }
  #matchups > :nth-child(2) { animation-delay: 0.06s; }
  #matchups > :nth-child(3) { animation-delay: 0.10s; }
  #matchups > :nth-child(4) { animation-delay: 0.14s; }
  #matchups > :nth-child(5) { animation-delay: 0.18s; }
  #matchups > :nth-child(6) { animation-delay: 0.22s; }
  #matchups > :nth-child(7) { animation-delay: 0.26s; }
  #matchups > :nth-child(8) { animation-delay: 0.30s; }
  #matchups > :nth-child(9) { animation-delay: 0.34s; }
  #matchups > :nth-child(n+10) { animation-delay: 0.38s; }
  /* When a card is both freshly inserted (cardEnter, above) and already
     upset-watching, a plain .upset-watch rule would win the `animation`
     shorthand outright and silently drop the entrance fade -- a single
     element can only run whichever value wins the cascade, not both,
     unless they're explicitly listed together. This compound selector
     (higher specificity than either single-class rule) runs both as one
     comma-separated list whenever both classes coexist. */
  .matchup-card.upset-watch, .postcard.upset-watch, .needle-card.upset-watch, .espn-card.upset-watch {
    animation: cardEnter 0.45s cubic-bezier(0.22, 1, 0.36, 1) both, upsetPulse 2.4s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .live { animation: none !important; }
    .matchup-card, .postcard, .needle-card, .espn-card { animation: none !important; }
    .upset-watch { animation: none !important; box-shadow: inset 0 0 0 1.5px var(--upset) !important; }
    .upset-watch-badge.pulsing { animation: none !important; opacity: 1; }
  }
  /* Explicit site preference (see preferences.html), separate from the OS-
     level prefers-reduced-motion above -- deliberately narrower in scope:
     only the three glow/pulse effects asked for (Live, Upset Watch,
     kickoff countdown), not the card entrance fade, which is a different
     kind of motion this preference was never meant to touch. Each keeps
     its static border/indicator so the underlying alert is still visible
     at a glance, just without the pulsing. */
  html[data-reduce-motion="true"] .live { animation: none !important; }
  html[data-reduce-motion="true"] .upset-watch { animation: none !important; box-shadow: inset 0 0 0 1.5px var(--upset) !important; }
  html[data-reduce-motion="true"] .upset-watch-badge.pulsing { animation: none !important; opacity: 1; }
  html[data-reduce-motion="true"] #kickoffCountdown.imminent { animation: none !important; box-shadow: inset 0 0 0 1px var(--accent) !important; }
  html[data-reduce-motion="true"] #kickoffCountdown.final-minute { animation: none !important; box-shadow: inset 0 0 0 1.5px var(--accent) !important; }
  /* The size increase itself still happens with reduced motion on (it's
     informative, not decorative) -- only the animated grow-into-place
     transition is suppressed, snapping directly to size instead. */
  html[data-reduce-motion="true"] #kickoffCountdown { transition: none; }

  /* ---- Championship Week hero banner -- a fixed-dark hero regardless of
     site theme (deliberately doesn't read --bg/--fg: stadium-lights-at-
     night reads as itself in both light and dark mode, the same way a
     photo hero on a light-mode page doesn't get color-inverted). Shown
     only during week 17 (or the debug preference -- see
     updateChampionshipStage in app.js), which toggles this element's
     `hidden` attribute and its own data-mode between "pregame" (spotlight
     sweep + countdown) and "live" (beams faded to 0 opacity, not removed,
     so there's no layout jump switching between the two). ---- */
  .championship-stage {
    position: relative;
    height: 200px;
    margin: 4px 0 18px;
    border-radius: 14px;
    overflow: hidden;
    background: radial-gradient(ellipse at center 120%, #10131c 0%, #05070c 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  /* Setting `display` on the class above is exactly what breaks the
     hidden attribute otherwise: the browser's own [hidden] { display:
     none } rule is equal specificity to a plain class selector, and an
     author rule at equal specificity always wins over that built-in
     default regardless of source order -- so without this override, the
     stage rendered visible any time toggling the `hidden` attribute
     off/on was the ONLY thing app.js did, i.e. always, whether or not
     championship week was actually active. */
  .championship-stage[hidden] { display: none; }
  .championship-stage::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 90% 60% at 50% 100%, rgba(244,196,48,0.10), transparent 70%);
    pointer-events: none;
  }
  .championship-stage .beam-field {
    position: absolute;
    inset: 0;
    opacity: 1;
    transition: opacity 0.8s ease;
    pointer-events: none;
  }
  .championship-stage[data-mode="live"] .beam-field { opacity: 0; }
  .championship-stage .beam {
    position: absolute;
    bottom: -40%;
    left: 50%;
    width: 120px;
    height: 220%;
    background: linear-gradient(to top, rgba(244,196,48,0.32) 0%, rgba(244,196,48,0.10) 35%, rgba(244,196,48,0) 75%);
    clip-path: polygon(46% 100%, 54% 100%, 100% 0%, 0% 0%);
    mix-blend-mode: screen;
    transform-origin: 50% 100%;
    animation: championshipSweep 7s ease-in-out infinite;
  }
  .championship-stage .beam.b2 {
    background: linear-gradient(to top, rgba(224,87,74,0.26) 0%, rgba(224,87,74,0.08) 35%, rgba(224,87,74,0) 75%);
    animation-duration: 9s; animation-delay: -2.3s;
  }
  .championship-stage .beam.b3 {
    background: linear-gradient(to top, rgba(58,103,223,0.26) 0%, rgba(58,103,223,0.08) 35%, rgba(58,103,223,0) 75%);
    animation-duration: 11s; animation-delay: -5.1s;
  }
  .championship-stage .beam.b4 {
    background: linear-gradient(to top, rgba(244,196,48,0.20) 0%, rgba(244,196,48,0.06) 35%, rgba(244,196,48,0) 75%);
    animation-duration: 8s; animation-delay: -1s;
  }
  @keyframes championshipSweep {
    0%   { transform: translateX(-50%) rotate(-38deg); }
    50%  { transform: translateX(-50%) rotate(38deg); }
    100% { transform: translateX(-50%) rotate(-38deg); }
  }
  .championship-stage .hype-copy { position: relative; z-index: 2; }
  .championship-stage .hype-eyebrow {
    font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
    color: #f4c430; font-weight: 700; margin-bottom: 8px; opacity: 0.9;
  }
  .championship-stage[data-mode="live"] .hype-eyebrow::after { content: ' \2014 LIVE'; color: #ff6a5a; }
  .championship-stage .hype-title {
    font-family: var(--font-display); font-weight: 400; font-size: 34px;
    letter-spacing: 0.01em; margin: 0 0 8px; color: #fff;
    text-shadow: 0 0 30px rgba(244,196,48,0.3);
  }
  .championship-stage .hype-countdown { font-size: 13px; color: #9aa3af; font-weight: 600; }
  .championship-stage .hype-countdown span { color: #f4c430; font-variant-numeric: tabular-nums; font-weight: 800; }

  /* Reduced motion (OS-level or the site preference) -- keeps the hero and
     its text, drops the sweeping beams entirely rather than just slowing
     them, matching how the delta popup and upset pulse degrade above. */
  @media (prefers-reduced-motion: reduce) {
    .championship-stage .beam { animation: none !important; opacity: 0 !important; }
  }
  html[data-reduce-motion="true"] .championship-stage .beam { animation: none !important; opacity: 0 !important; }

  /* ---- Playoff tier ribbon -- shown on ESPN/Needle cards during
     championship week (see applyTierRibbon in app.js), and paired with a
     subtle border tint per tier so the championship game reads as the
     header act even in a quick scroll past. Independent of .upset-watch's
     own border treatment -- a championship-tier card that's ALSO upset-
     watching keeps the pulsing upset border (the more urgent, live signal)
     while still showing its gold ribbon text up top. */
  .tier-ribbon {
    text-align: center; font-family: var(--font-display); font-weight: 400;
    font-size: var(--text-sm); letter-spacing: 0.04em; text-transform: uppercase;
    margin-bottom: 6px;
  }
  .espn-card.tier-champ, .needle-card.tier-champ { box-shadow: inset 0 0 0 1px var(--tier-champ); }
  .espn-card.tier-champ .tier-ribbon, .needle-card.tier-champ .tier-ribbon { color: var(--tier-champ); }
  .espn-card.tier-third .tier-ribbon, .needle-card.tier-third .tier-ribbon { color: var(--tier-third); }
  .espn-card.tier-other .tier-ribbon, .needle-card.tier-other .tier-ribbon { color: var(--tier-other); }

  /* ---- Seasonal card decor (Thanksgiving/Christmas) -- see
     decorateSeasonalCard in app.js, which is the only thing that adds
     .seasonal-thanksgiving/.seasonal-christmas to a card and builds the
     .seasonal-garland's contents. Both ESPN and Needle cards get
     position:relative so the pumpkin corners and garland can be
     positioned against the card itself rather than the page. ---- */
  .espn-card, .needle-card { position: relative; }

  .pumpkin-corner {
    position: absolute; top: -12px; font-size: 20px;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4));
    display: none; z-index: 2;
  }
  .pumpkin-corner.left { left: -6px; transform: rotate(-12deg); }
  .pumpkin-corner.right { right: -6px; transform: rotate(10deg) scaleX(-1); }
  .seasonal-thanksgiving .pumpkin-corner { display: block; }

  /* Halloween's corner decor: ghosts instead of pumpkins (Thanksgiving
     already owns pumpkins in this site's visual language) -- a gentle
     float/bob rather than the pumpkin's static rotate-and-hold. */
  .ghost-corner {
    position: absolute; top: -10px; font-size: 20px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    display: none; z-index: 2;
    animation: ghostFloat 3.4s ease-in-out infinite;
  }
  .ghost-corner.left { left: -4px; }
  .ghost-corner.right { right: -4px; transform: scaleX(-1); animation-delay: 1.1s; }
  .seasonal-halloween .ghost-corner { display: block; }
  @keyframes ghostFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  /* Shared wire-and-decoration strand for the Thanksgiving leaf garland,
     the Christmas light strand, and the Halloween cobweb -- see
     buildSeasonalGarland in app.js, which draws the scalloped SVG wire and
     positions whatever decoration (a leaf emoji, a colored bulb div, or a
     spider emoji) at the bottom of each droop. Bled slightly past the
     card's own top edge via negative margin so it reads as draped along
     the card rather than floating inside it. */
  .seasonal-garland {
    position: relative; height: 28px; margin: -10px -6px 8px; display: none;
  }
  .seasonal-thanksgiving .seasonal-garland,
  .seasonal-christmas .seasonal-garland,
  .seasonal-halloween .seasonal-garland { display: block; }
  .seasonal-garland-wire { position: absolute; inset: 0; width: 100%; height: 100%; }
  .seasonal-garland-wire path { fill: none; stroke-width: 2; }
  .seasonal-thanksgiving .seasonal-garland-wire path { stroke: #6b4a2a; }
  .seasonal-christmas .seasonal-garland-wire path { stroke: #2a2a2a; }
  /* Cobweb strand: pale gray-white and thinner, reads as spun silk rather
     than a wire. */
  .seasonal-halloween .seasonal-garland-wire path { stroke: rgba(220,220,230,0.55); stroke-width: 1.4; }

  .seasonal-leaf {
    position: absolute; transform: translate(-50%, -50%);
    font-size: 14px; animation: seasonalLeafSway 3s ease-in-out infinite;
  }
  @keyframes seasonalLeafSway {
    0%, 100% { transform: translate(-50%, -50%) rotate(-6deg); }
    50% { transform: translate(-50%, -50%) rotate(6deg); }
  }

  /* Christmas bulbs -- colored per-matchup via --bulb-color, set inline by
     buildLights in app.js from each of the two teams' own colors,
     alternating. Twinkle independently by default; see .upset-lights
     below for what happens when the card's own live Upset Watch state
     (the SAME upsetInfo already computed for the badge/border, not a
     separate detector) is active. The third, widest box-shadow layer is a
     warm amber halo (--bulb-warm-glow, themed light/dark above) behind the
     two team-colored ones -- an incandescent-bulb warmth that reads
     underneath whatever color the bulb itself is, rather than another
     colored glow competing with it. Rides the same brightness keyframe as
     the rest of the element since filter affects the whole box-shadow
     stack, so it pulses in sync with the twinkle for free. Dropped
     entirely (not just recolored) by .upset-lights below, which needs the
     alert to read as urgent rather than cozy. */
  .seasonal-bulb {
    position: absolute; width: 8px; height: 12px;
    background: var(--bulb-color);
    border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;
    transform: translate(-50%, -50%);
    box-shadow:
      0 0 5px 2px var(--bulb-color),
      0 0 12px 3px var(--bulb-color),
      0 0 22px 9px var(--bulb-warm-glow);
    animation: seasonalBulbTwinkle 2.6s ease-in-out infinite;
  }
  @keyframes seasonalBulbTwinkle {
    0%, 100% { opacity: 0.7; filter: brightness(0.85); }
    50% { opacity: 1; filter: brightness(1.3); }
  }
  /* Synced pulse when this card's own Upset Watch is active -- every bulb
     switches to the alert color and pulses together on the SAME 2.4s
     cadence as the rest of the site's upset pulse (upsetPulse/
     upsetTextPulse above), so this reads as one alert system rather than
     a separate lighting effect that happens to also change color. */
  .seasonal-garland.upset-lights .seasonal-bulb {
    background: var(--upset) !important;
    box-shadow: 0 0 6px 3px var(--upset-glow-a), 0 0 16px 6px var(--upset-glow-b) !important;
    animation: seasonalBulbUpsetPulse 2.4s ease-in-out infinite !important;
    animation-delay: 0s !important;
  }
  @keyframes seasonalBulbUpsetPulse {
    0%, 100% { opacity: 0.85; filter: brightness(1); }
    50% { opacity: 1; filter: brightness(1.5); }
  }

  /* Thanksgiving's Upset Watch tie-in: leaves glow the alert orange and
     pulse on the SAME 2.4s cadence as the Christmas bulbs above, overriding
     the idle seasonalLeafSway animation. Every themed week now reacts to
     Upset Watch the same way -- this was previously the one theme with no
     tie-in at all. */
  .seasonal-garland.upset-leaves .seasonal-leaf {
    filter: drop-shadow(0 0 4px var(--upset-glow-a)) drop-shadow(0 0 8px var(--upset-glow-b));
    animation: seasonalLeafUpsetPulse 2.4s ease-in-out infinite !important;
  }
  @keyframes seasonalLeafUpsetPulse {
    0%, 100% { transform: translate(-50%, -50%) rotate(-6deg) scale(1); }
    50% { transform: translate(-50%, -50%) rotate(6deg) scale(1.22); }
  }

  /* Halloween's spider, dangling from the cobweb strand -- idle sway
     normally, alert-orange glow + scale pulse (same color/cadence as the
     other two) when this card's own Upset Watch fires. */
  .seasonal-spider {
    position: absolute; transform: translate(-50%, -50%);
    font-size: 13px; animation: seasonalSpiderSway 2.8s ease-in-out infinite;
  }
  @keyframes seasonalSpiderSway {
    0%, 100% { transform: translate(-50%, -50%) rotate(-8deg); }
    50% { transform: translate(-50%, -50%) rotate(8deg); }
  }
  .seasonal-garland.upset-spiders .seasonal-spider {
    animation: seasonalSpiderUpsetPulse 2.4s ease-in-out infinite !important;
    filter: drop-shadow(0 0 4px var(--upset-glow-a)) drop-shadow(0 0 8px var(--upset-glow-b));
  }
  @keyframes seasonalSpiderUpsetPulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.25); }
  }

  @media (prefers-reduced-motion: reduce) {
    .seasonal-leaf, .seasonal-spider, .ghost-corner { animation: none !important; }
    .seasonal-bulb { animation: none !important; opacity: 0.95 !important; }
    .seasonal-garland.upset-lights .seasonal-bulb { animation: none !important; opacity: 1 !important; }
    .seasonal-garland.upset-leaves .seasonal-leaf,
    .seasonal-garland.upset-spiders .seasonal-spider { animation: none !important; }
  }
  html[data-reduce-motion="true"] .seasonal-leaf,
  html[data-reduce-motion="true"] .seasonal-spider,
  html[data-reduce-motion="true"] .ghost-corner { animation: none !important; }
  html[data-reduce-motion="true"] .seasonal-bulb { animation: none !important; opacity: 0.95 !important; }
  html[data-reduce-motion="true"] .seasonal-garland.upset-lights .seasonal-bulb { animation: none !important; opacity: 1 !important; }
  html[data-reduce-motion="true"] .seasonal-garland.upset-leaves .seasonal-leaf,
  html[data-reduce-motion="true"] .seasonal-garland.upset-spiders .seasonal-spider { animation: none !important; }

  /* ---- "Why is this the number?" button + blurb, shared across all views ---- */
  .why-btn {
    background: none; border: none; cursor: pointer; padding: 0 0 0 2px;
    color: var(--muted); font-size: 13px; line-height: 1; vertical-align: middle;
  }
  .why-btn:hover { color: var(--accent); }
  .why-blurb {
    font-size: 12px; color: var(--muted); font-style: italic;
    margin: 2px 0 10px; line-height: 1.5; white-space: pre-line;
  }

  #matchups { transition: opacity 180ms ease; }
  #matchups.view-fading { opacity: 0; }

  /* ---- Timeline view (stacked line charts) ---- */
  #matchups.view-timeline { display: flex; flex-direction: column; gap: 34px; }
  .matchup-card { border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; background: var(--card-bg); }
  .matchup-title { display: flex; justify-content: space-between; font-size: var(--text-base); margin-bottom: 8px; }
  .matchup-title b { font-family: var(--font-display); font-weight: 400; letter-spacing: 0.01em; }
  .matchup-title span:last-child:not(.live) { color: var(--muted); }
  .matchup-title .live { color: var(--live); font-weight: 600; animation: liveGlow 1.8s ease-in-out infinite; }
  .chartBox { position: relative; height: 300px; width: 100%; }

  /* ---- Power Picks view (pregame predictions, no live data yet) ----
     Takes over #matchups entirely between when the poller starts writing
     a week's pairings (24h before kickoff -- see poll.js) and that week's
     actual first kickoff; the view-toggle buttons are hidden for the same
     span since none of the graph views have anything real to plot yet. */
  #matchups.view-power-picks {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;
  }
  .power-picks-banner { grid-column: 1 / -1; text-align: center; margin-bottom: 4px; }
  .pp-title { font-family: var(--font-display); font-weight: 400; font-size: var(--text-xl); }
  .pp-preview-tag {
    font-family: var(--font-body); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--accent); border: 1px solid var(--accent); border-radius: 20px; padding: 2px 8px; vertical-align: middle;
  }
  .pp-sub { color: var(--muted); font-size: var(--text-sm); margin-top: 2px; }
  .power-picks-card {
    border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; background: var(--card-bg);
    border-top: 3px solid var(--home-color, var(--border));
  }
  .pp-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .pp-icon { flex: 0 0 auto; }
  .pp-name {
    font-family: var(--font-display); font-weight: 400; font-size: var(--text-base);
    flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pp-score { color: var(--muted); font-size: var(--text-xs); font-variant-numeric: tabular-nums; }
  .pp-pick { font-size: var(--text-lg); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
  .pp-vs { text-align: center; color: var(--muted); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.05em; }
  .pp-footer {
    margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border);
    font-size: var(--text-sm); text-align: center;
  }

  /* ---- Postcard view (compact grid of the same line charts) ---- */
  #matchups.view-postcard {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;
  }
  .postcard {
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--card-bg);
  }
  .postcard-title { display: flex; justify-content: space-between; font-size: var(--text-sm); margin-bottom: 4px; }
  .postcard-title b { font-family: var(--font-display); font-weight: 400; letter-spacing: 0.01em; }
  .postcard-title span:last-child:not(.live) { color: var(--muted); }
  .postcard-title .live { color: var(--live); font-weight: 600; animation: liveGlow 1.8s ease-in-out infinite; }
  .postcard-chartBox { position: relative; height: 140px; width: 100%; }

  /* ---- Shared status pill (needle view) ---- */
  .postcard-status { font-size: var(--text-xs); color: var(--muted); text-align: right; margin-bottom: 6px; }
  .postcard-status.live { color: var(--live); font-weight: 600; animation: liveGlow 1.8s ease-in-out infinite; }

  /* ---- ESPN view (dotted line, persistent marker, static top/bottom rows) ---- */
  #matchups.view-espn { display: flex; flex-direction: column; gap: 28px; }
  .espn-card { border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; background: var(--card-bg); }
  .espn-header { display: flex; align-items: center; margin-bottom: 6px; }
  .espn-header .postcard-status { margin-bottom: 0; margin-left: auto; }
  .espn-header .why-blurb { margin: 0 0 0 10px; flex: 1; }
  .espn-row { display: flex; align-items: center; gap: 10px; padding: 4px 0; position: relative; }
  .espn-emoji { font-size: 20px; line-height: 1; min-width: 1.2em; text-align: center; display: inline-flex; align-items: center; justify-content: center; }
  /* Sized to roughly match the emoji it replaces, so swapping between a
     team that has a logo and one that still just has an emoji doesn't
     shift the row's layout. object-fit:cover matters even though uploads
     are already center-cropped to square client-side -- a browser
     rendering an old/cached image before that logic existed, or any
     future path that stores a non-square image, still won't look
     squished. */
  .team-icon-img { width: 22px; height: 22px; border-radius: 5px; object-fit: cover; display: block; }
  .espn-name { font-family: var(--font-display); font-weight: 400; font-size: var(--text-base); letter-spacing: 0.01em; }
  .espn-dash { flex: 1; height: 3px; border-radius: 2px; opacity: 0.4; margin: 0 6px; }
  .espn-pct { font-family: var(--font-display); font-weight: 400; font-size: var(--text-2xl); font-variant-numeric: tabular-nums; margin-left: auto; }
  .espn-chartBox { position: relative; height: 220px; width: 100%; margin: 6px 0; }

  /* ---- Needle/Forecasting view -- full-width stacked cards like ESPN
     view, not a grid of narrow ones. The whole point of the spacious,
     two-column layout below is a wide card; a narrow grid cell would
     leave no room for the needle and the info column to sit side by
     side. ---- */
  #matchups.view-needle { display: flex; flex-direction: column; gap: 28px; }
  .needle-card {
    border: 1px solid var(--border); border-radius: 14px; padding: 20px 24px 24px; background: var(--card-bg);
  }

  /* ---- Top row: needle on the left, team identity on the right -- the
     right column deliberately mirrors the ESPN card's own name/dash/
     percentage row convention (including the same fading-dash
     treatment), so this reads as a natural sibling of that card rather
     than a different visual language entirely. ---- */
  .fc-top-row {
    display: flex; gap: 22px; align-items: center; margin-bottom: 18px;
    /* Centers the gauge+info group as a compact unit rather than
       stretching .fc-info-col to fill the card's full width -- #wrap
       caps the page at 900px, so on a wide card a flex:1 info column
       (and its flex:1 dash) stretched across hundreds of pixels of
       empty space between the team name and the percentage. */
    justify-content: center;
  }
  .fc-gauge-col { flex: 0 0 180px; text-align: center; }
  .needle-gauge { width: 180px; margin: 0 auto; }
  .needle-svg { width: 100%; height: auto; display: block; }
  .needle-pointer { transition: transform 0.4s ease; }
  .needle-verdict { font-family: var(--font-display); font-weight: 400; font-size: var(--text-lg); letter-spacing: 0.01em; margin-top: 4px; }
  .fc-confidence-chip {
    display: inline-block; margin-top: 6px; padding: 3px 10px; border-radius: 12px;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; border: 1px solid currentColor;
  }
  .fc-info-col { flex: 0 1 380px; display: flex; flex-direction: column; justify-content: center; gap: 12px; min-width: 0; }
  .fc-team-row { display: flex; align-items: center; gap: 10px; position: relative; }
  .fc-team-name { font-family: var(--font-display); font-weight: 400; font-size: var(--text-base); }
  /* Capped rather than flex:1 -- a short connecting dash, not a stretch
     to fill however much column width happens to be available. */
  .fc-team-dash { flex: 1 1 auto; max-width: 60px; height: 2px; background: linear-gradient(90deg, currentColor 0%, transparent 92%); opacity: 0.9; }
  .fc-team-pct { font-family: var(--font-display); font-weight: 400; font-size: var(--text-xl); font-variant-numeric: tabular-nums; margin-left: auto; }
  .needle-sub { font-size: var(--text-sm); color: var(--muted); margin-top: 2px; text-align: center; }

  /* ---- Forecasting content -- tiles rather than a flat title/note
     stack, reusing the SAME --input-bg tinted-tile convention the
     weekly recap's own cards already use, for visual consistency
     between the two. Flexbox (not grid) for the paired-stat row for the
     same reason the recap grid uses it: an odd tile count (Confidence
     Narrowing only shows sometimes) would otherwise leave a lone tile
     left-aligned with an awkward empty gap on a fixed 2-column grid. ---- */
  .forecast-section { text-align: left; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .fc-tile-grid { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
  .fc-tile { background: var(--input-bg); border-radius: 10px; padding: 14px 16px; flex: 1 1 45%; min-width: 160px; }
  .fc-tile-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); margin-bottom: 8px;
  }
  .fc-tile-row { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; font-size: 13px; padding: 2px 0; }
  .fc-tile-row b { font-variant-numeric: tabular-nums; }
  .fc-tile-range { color: var(--muted); font-size: 11px; }
  .fc-tile-note { font-size: 12.5px; line-height: 1.5; color: var(--fg); }

  .fc-full-tile { background: var(--input-bg); border-radius: 10px; padding: 14px 16px 12px; margin-bottom: 12px; }
  .fc-full-tile .fc-tile-note, .fc-full-tile .fc-timeline-caption { margin-top: 2px; }

  /* Volatility: lead-ownership strip, color intensity scaled by how
     decisive each stretch was (not a flat team color), so a
     barely-ahead stretch looks faint and a blowout stretch looks fully
     saturated. */
  .fc-timeline { display: flex; height: 10px; border-radius: 5px; overflow: hidden; margin: 8px 0 6px; position: relative; }
  .fc-timeline .seg { height: 100%; }
  .fc-timeline .flip { position: absolute; top: -3px; width: 2px; height: 16px; background: var(--fg); opacity: 0.5; }
  .fc-timeline-caption { font-size: 12px; color: var(--muted); }

  /* Probability Swing: a diverging bar centered on 50 -- each team's own
     color extends from center toward its own peak, with "100" labeled
     in each team's color at either end and "50" neutral in the middle,
     so distance from center always means "how far this team got,"
     while color (not position) says which team. */
  .fc-swing-bar { position: relative; height: 8px; border-radius: 4px; background: var(--border); margin: 8px 0 6px; }
  .fc-swing-range { position: absolute; top: 0; height: 100%; border-radius: 4px; }
  .fc-swing-marker { position: absolute; top: -3px; width: 2px; height: 14px; }
  .fc-swing-labels { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); }

  /* Upset-primed proximity meter -- a threshold you can see closing in,
     rather than a sentence. Uses --warn (distinct from --upset, the
     already-triggered alert color) so the two states read as visually
     different, since they mean different things. */
  .fc-primed { background: color-mix(in srgb, var(--warn) 10%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .fc-primed-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--warn); margin-bottom: 6px; }
  .fc-primed .fc-tile-note { margin-bottom: 10px; }
  .fc-meter { position: relative; height: 7px; border-radius: 4px; background: var(--border); margin-bottom: 4px; }
  .fc-meter-fill { position: absolute; top: 0; left: 0; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #4fbd82, var(--warn)); }
  .fc-meter-marker { position: absolute; top: -3px; width: 3px; height: 13px; background: var(--fg); border-radius: 2px; }
  .fc-meter-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); }

  a.settings-link { display: block; text-align: center; margin-top: 10px; font-size: 13px; color: var(--accent); }
  #settingsLinks { margin-top: 26px; }
</style>
</head>
<body>
<!-- Full-page seasonal particle field -- falling leaves during
     Thanksgiving week, falling snow during Christmas week, nothing
     otherwise. Fixed position so it covers the viewport regardless of
     scroll, always present in the DOM (never added/removed) so there's
     no start-up flicker; driven by app.js's currentSeasonalTheme (set in
     loadMatchups) and the seasonalTick draw loop, which is the only thing
     that starts/stops drawing and picks which particle shape to draw. -->
<canvas id="seasonalParticleCanvas"></canvas>
<!-- Halloween ground fog -- always in the DOM, gated purely by CSS via
     html[data-seasonal-theme="halloween"] (see the #seasonalFog rule
     above), which app.js sets alongside currentSeasonalTheme. Two layers
     drifting at different speeds/opacities for a little depth; both are
     pure CSS (a repeating blurred radial gradient sliding via transform),
     no canvas or per-frame JS needed. -->
<div id="seasonalFog"><div class="fog-layer fog-layer-1"></div><div class="fog-layer fog-layer-2"></div></div>
<div id="leaderGradient"><div class="leader-gradient-layer" id="leaderGradientLayerA"></div><div class="leader-gradient-layer" id="leaderGradientLayerB"></div></div>
<div id="wrap">
  <h2>Fantasy Win Probability</h2>
  <div class="sub">Updates automatically every ~1 minute while games are live.</div>

  <!-- Week 17 hero banner -- hidden entirely outside championship week
       (real or debug-forced, see updateChampionshipStage in app.js).
       data-mode="pregame"/"live" (set by the same function) switches the
       spotlight sweep on/off via CSS -- the beam markup itself always
       stays in the DOM so there's no animation restart flicker when a
       poll flips the mode. -->
  <div id="championshipStage" class="championship-stage" hidden>
    <div class="beam-field">
      <div class="beam b1"></div>
      <div class="beam b2"></div>
      <div class="beam b3"></div>
      <div class="beam b4"></div>
    </div>
    <div class="hype-copy">
      <div class="hype-eyebrow">Week 17</div>
      <h1 class="hype-title">Championship Week</h1>
      <div class="hype-countdown" id="hypeCountdown" hidden></div>
    </div>
  </div>

  <a id="yearInReviewLink" href="year-in-review.html" hidden>🏆 Year in Review</a>

  <!-- Restructured to hold a small confined particle canvas alongside the
       label/time text (see the "Kickoff countdown" seasonal-hint block in
       app.js) -- tickKickoffCountdown updates the label/time spans'
       textContent directly rather than overwriting this element's whole
       innerHTML every second, specifically so the canvas survives every
       tick instead of being torn down and recreated 60 times a minute. -->
  <div id="kickoffCountdown" hidden>
    <canvas class="cd-particle-canvas" id="kickoffCountdownParticles"></canvas>
    <span class="kickoff-label" id="kickoffCountdownLabelEl"></span>
    <span class="kickoff-time" id="kickoffCountdownTimeEl"></span>
    <div class="kickoff-seasonal-hint" id="kickoffSeasonalHint" hidden></div>
  </div>

  <div id="recapBanner" hidden></div>

  <div id="controls">
    <select id="leagueSelect"></select>
    <select id="yearSelect"></select>
    <select id="weekSelect"></select>
    <button id="themeToggle"></button>
  </div>

  <div id="viewToggle">
    <button class="view-btn" data-view="espn">ESPN</button>
    <button class="view-btn" data-view="timeline">Timeline</button>
    <button class="view-btn" data-view="postcard">Postcard</button>
    <button class="view-btn" data-view="needle">Forecast</button>
  </div>

  <div id="status"></div>
  <div id="byeWeekNote" hidden></div>
  <div id="matchups" class="view-espn"></div>

  <div id="settingsLinks">
    <a class="settings-link" href="settings.html">Team colors & names &rarr;</a>
    <a class="settings-link" href="preferences.html">Display settings &rarr;</a>
    <a class="settings-link" href="standings.html">Standings &rarr;</a>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js?v=25"></script>
</body>
</html>
