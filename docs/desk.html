<!DOCTYPE html>
<html data-studio="pro" data-daypart="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News Desk — Fantasy Win Probability Tracker</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,700;0,800;1,800&family=Inter:wght@400;600;700&family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ======================================================================
   Four looks: two studios (pro = Branford, casual = Family League), each
   with a day and a night version. Everything below reads these tokens.
   ====================================================================== */
:root, html[data-studio="pro"][data-daypart="day"] {
  --bg: #e9eef6; --bg2: #ffffff; --panel: rgba(255,255,255,.86); --panel-2: #f3f6fb; --line: rgba(10,30,70,.14);
  --fg: #0b1a33; --muted: #5a6a85; --accent: #0a4bd6; --accent-2: #00a3ff; --hot: #e11d2e; --good: #0f9d58;
  --bar: linear-gradient(90deg, #0a2a6b, #0a4bd6 60%, #00a3ff); --bar-fg: #fff;
  --stage-bg: radial-gradient(ellipse at 20% 0%, #ffffff 0%, #dfe7f3 60%, #c9d5e8 100%);
  --font-head: 'Barlow Condensed', 'Arial Narrow', sans-serif; --font-body: 'Inter', system-ui, sans-serif;
  --radius: 4px; --clip: polygon(0 0, 100% 0, calc(100% - 18px) 100%, 0 100%); --head-style: italic; --head-weight: 800;
  --glow: 0 0 0 transparent;
}
html[data-studio="pro"][data-daypart="night"] {
  --bg: #040a1c; --bg2: #081433; --panel: rgba(10,22,52,.82); --panel-2: rgba(16,32,72,.75); --line: rgba(120,170,255,.18);
  --fg: #eaf1ff; --muted: #8ea3c9; --accent: #3d8bff; --accent-2: #36e0ff; --hot: #ff3348; --good: #27d07c;
  --bar: linear-gradient(90deg, #08163f, #1440a8 55%, #36e0ff); --bar-fg: #fff;
  --stage-bg: radial-gradient(ellipse at 50% -20%, #1b3d8f 0%, #0a1a46 40%, #030817 85%);
  --glow: 0 0 24px rgba(54,224,255,.35);
}
html[data-studio="casual"][data-daypart="day"] {
  --bg: #fbf3e2; --bg2: #fffaf0; --panel: rgba(255,251,240,.9); --panel-2: #f6ead2; --line: rgba(90,60,20,.16);
  --fg: #3a2a17; --muted: #8a7254; --accent: #3f8f4e; --accent-2: #f29a2e; --hot: #e2553a; --good: #3f8f4e;
  --bar: linear-gradient(90deg, #3f8f4e, #6cb35c 50%, #f2b544); --bar-fg: #fffdf5;
  --stage-bg: radial-gradient(ellipse at 30% 0%, #fffdf6 0%, #fbefd5 55%, #f3dfb8 100%);
  --font-head: 'Baloo 2', 'Nunito', system-ui, sans-serif; --font-body: 'Nunito', system-ui, sans-serif;
  --radius: 22px; --clip: none; --head-style: normal; --head-weight: 800;
}
html[data-studio="casual"][data-daypart="night"] {
  --bg: #1b130e; --bg2: #261a12; --panel: rgba(44,30,20,.85); --panel-2: rgba(60,40,26,.8); --line: rgba(255,200,130,.16);
  --fg: #fbe9d0; --muted: #c4a27c; --accent: #f2a54a; --accent-2: #8fd18a; --hot: #ff7a59; --good: #8fd18a;
  --bar: linear-gradient(90deg, #6b3d1c, #c0702a 55%, #f2b544); --bar-fg: #fff8ec;
  --stage-bg: radial-gradient(ellipse at 75% 10%, #5a3518 0%, #2a1b11 45%, #140d09 90%);
  --font-head: 'Baloo 2', 'Nunito', system-ui, sans-serif; --font-body: 'Nunito', system-ui, sans-serif;
  --radius: 22px; --clip: none; --head-style: normal; --glow: 0 0 30px rgba(242,165,74,.25);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #05070d !important; }
body { font-family: var(--font-body); color: var(--fg); }

/* The show is laid out at 1920x1080 and scaled to fit any screen. */
/* #tv fills the whole window (sized in desk.js fit()); #frame is the 1920x1080 layout, centered in it.
   Backgrounds, the ticker strip, breaking news and the handoff wipe run edge to edge. */
#tv { position: fixed; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: var(--stage-bg); overflow: hidden; transition: background 1.2s ease; }
#frame { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
#tv::before { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background: repeating-linear-gradient(90deg, transparent 0 119px, var(--line) 119px 120px); -webkit-mask-image: linear-gradient(180deg, #000, transparent 70%); mask-image: linear-gradient(180deg, #000, transparent 70%); }
html[data-studio="casual"] #tv::before { background: radial-gradient(circle at 10% 20%, var(--line) 0 2px, transparent 3px) 0 0/60px 60px; opacity: .6; }

/* ---- top bar ---- */
#top { position: absolute; left: 0; right: 0; top: 0; height: 104px; display: flex; align-items: center; gap: 26px; padding: 0 48px; z-index: 5; }
#brand { display: flex; align-items: center; gap: 18px; }
#brandMark { height: 72px; min-width: 72px; padding: 0 22px; display: grid; place-items: center; background: var(--bar); color: var(--bar-fg); clip-path: var(--clip); border-radius: var(--radius);
  font: var(--head-style) var(--head-weight) 40px/1 var(--font-head); letter-spacing: .02em; box-shadow: var(--glow); white-space: nowrap; }
#brandShow { font: var(--head-style) 700 30px/1 var(--font-head); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
#brandSub { font: 600 16px/1.2 var(--font-body); color: var(--muted); margin-top: 4px; letter-spacing: .04em; }
#live { margin-left: auto; display: flex; align-items: center; gap: 10px; font: 800 24px/1 var(--font-head); letter-spacing: .1em; padding: 10px 18px; border-radius: var(--radius); background: var(--hot); color: #fff; }
#live i { width: 12px; height: 12px; border-radius: 50%; background: #fff; animation: blink 1.2s infinite; }
#live.off { background: var(--panel-2); color: var(--muted); } #live.off i { background: var(--muted); animation: none; }
@keyframes blink { 50% { opacity: .2; } }
#clock { font: 700 34px/1 var(--font-head); letter-spacing: .04em; min-width: 150px; text-align: right; }
#np { position: absolute; right: 48px; top: 100px; font: 600 13px var(--font-body); color: var(--muted); opacity: .8; }

/* ---- main stage + side column ---- */
#stage { position: absolute; left: 48px; top: 130px; width: 1210px; height: 700px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 20px 60px rgba(0,0,0,.15), var(--glow); overflow: hidden; }
#segLabel { position: absolute; left: 0; top: 0; height: 56px; padding: 0 34px 0 28px; display: flex; align-items: center; background: var(--bar); color: var(--bar-fg); clip-path: var(--clip); border-bottom-right-radius: var(--radius);
  font: var(--head-style) var(--head-weight) 30px/1 var(--font-head); letter-spacing: .05em; text-transform: uppercase; z-index: 2; }
#segBody { position: absolute; inset: 56px 0 0 0; padding: 26px 34px 28px; }
.seg-in { animation: segIn .7s cubic-bezier(.2,.8,.2,1) both; }
@keyframes segIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
#segProgress { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--accent); width: 0; }

#side { position: absolute; left: 1290px; top: 130px; width: 582px; height: 700px; display: flex; flex-direction: column; gap: 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,.12); }
.card h3 { margin: 0; padding: 14px 20px; font: var(--head-style) var(--head-weight) 24px/1 var(--font-head); letter-spacing: .06em; text-transform: uppercase; background: var(--panel-2); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
.card h3 small { font: 600 14px var(--font-body); color: var(--muted); letter-spacing: 0; text-transform: none; }
#rundown { flex: 1; }
#rundownList { padding: 8px 20px 14px; }
.rd { padding: 12px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 8px 1fr auto; gap: 14px; align-items: start; }
.rd:last-child { border-bottom: 0; }
.rd .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 9px; background: var(--muted); }
.rd.p2 .dot { background: var(--hot); } .rd.p1 .dot { background: var(--accent); }
.rd b { display: block; font: 700 21px/1.15 var(--font-head); letter-spacing: .02em; }
.rd span { display: block; font-size: 15px; color: var(--muted); margin-top: 3px; line-height: 1.3; }
.rd time { font: 600 13px var(--font-body); color: var(--muted); white-space: nowrap; margin-top: 5px; }
.rd.new { animation: rdIn .8s ease both; }
@keyframes rdIn { from { background: color-mix(in srgb, var(--accent) 25%, transparent); } }
#otherStudio { height: 240px; flex: none; }
#otherBody { padding: 12px 20px; display: grid; gap: 8px; }

/* ---- anchor lower third ---- */
#anchor { position: absolute; left: 48px; top: 852px; width: 1824px; height: 112px; display: flex; align-items: stretch; z-index: 4; }
#anchorTag { width: 230px; display: grid; place-items: center; text-align: center; background: var(--bar); color: var(--bar-fg); clip-path: var(--clip); border-radius: var(--radius) 0 0 var(--radius); font: var(--head-style) var(--head-weight) 26px/1.05 var(--font-head); letter-spacing: .04em; text-transform: uppercase; padding: 0 22px; }
#anchorText { flex: 1; background: var(--panel); border: 1px solid var(--line); border-left: 0; border-radius: 0 var(--radius) var(--radius) 0; padding: 0 30px; display: flex; align-items: center; font: 600 30px/1.25 var(--font-body); overflow: hidden; }

/* ---- ticker ---- */
#ticker { position: absolute; left: 0; right: 0; bottom: 0; height: 86px; display: flex; background: #05070d; color: #fff; z-index: 6; box-shadow: 0 0 0 100vmax #05070d; clip-path: inset(0 -100vmax -100vmax -100vmax); }
#tickerLabel { padding: 0 28px; display: grid; place-items: center; background: var(--bar); color: var(--bar-fg); font: italic 800 30px/1 'Barlow Condensed', sans-serif; letter-spacing: .06em; white-space: nowrap; }
html[data-studio="casual"] #tickerLabel { font-style: normal; font-family: 'Baloo 2', sans-serif; }
#tickerTrack { flex: 1; overflow: hidden; position: relative; -webkit-mask-image: linear-gradient(90deg, transparent, #000 3%, #000 97%, transparent); mask-image: linear-gradient(90deg, transparent, #000 3%, #000 97%, transparent); }
#tickerRun { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; white-space: nowrap; will-change: transform; }
.tk { display: inline-flex; align-items: center; gap: 12px; padding: 0 34px; font: 600 27px/1 'Inter', sans-serif; border-right: 1px solid rgba(255,255,255,.15); }
.tk .lg { font: 800 18px/1 'Barlow Condensed', sans-serif; letter-spacing: .12em; padding: 6px 10px; border-radius: 4px; background: rgba(255,255,255,.12); }
.tk .tm { display: inline-flex; align-items: center; gap: 9px; color: var(--c); opacity: .82; } .tk .tm.w { opacity: 1; font-weight: 800; }
.tk .tm i { width: 6px; height: 26px; border-radius: 2px; background: var(--c); }
.tk .pct { color: #c9d6f2; font-weight: 800; } .tk .hl { color: #fff; font-weight: 800; border-left: 6px solid var(--c, #ffd166); padding-left: 12px; }

/* ---- alert (minor) ---- */
#alert { position: absolute; left: 48px; top: 852px; width: 1824px; height: 112px; display: flex; align-items: center; gap: 22px; padding: 0 26px; z-index: 7; border-radius: var(--radius);
  background: var(--fg); color: var(--bg2); transform: translateY(160px); opacity: 0; transition: transform .5s cubic-bezier(.2,.9,.2,1), opacity .4s; }
#alert.show { transform: none; opacity: 1; }
#alert .tag { padding: 10px 16px; background: var(--accent); color: #fff; border-radius: var(--radius); font: var(--head-style) var(--head-weight) 26px/1 var(--font-head); letter-spacing: .06em; white-space: nowrap; }
#alert .txt b { display: block; font: var(--head-style) var(--head-weight) 34px/1.05 var(--font-head); letter-spacing: .02em; }
#alert .txt span { font: 600 20px/1.3 var(--font-body); opacity: .85; }
#alert .ic { margin-left: auto; }

/* ---- breaking takeover ---- */
#breaking { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; pointer-events: none; opacity: 0; }
#breaking.show { opacity: 1; }
#breaking .bg { position: absolute; inset: 0; background: radial-gradient(ellipse at center, color-mix(in srgb, var(--bt, #e11d2e) 55%, #000) 0%, #000 75%); opacity: .94; }
#breaking .stripes { position: absolute; left: -10%; right: -10%; top: 50%; height: 300px; transform: translateY(-50%) skewY(-4deg); background: repeating-linear-gradient(90deg, var(--hot) 0 60px, color-mix(in srgb, var(--hot) 70%, #000) 60px 120px); opacity: .25; animation: slide 2s linear infinite; }
@keyframes slide { to { background-position: 240px 0; } }
#breaking .box { position: relative; width: 1500px; text-align: center; color: #fff; }
#breaking .kick { display: inline-block; font: italic 800 54px/1 'Barlow Condensed', sans-serif; letter-spacing: .2em; padding: 14px 36px; background: var(--hot); clip-path: polygon(3% 0, 100% 0, 97% 100%, 0 100%); }
html[data-studio="casual"] #breaking .kick { font-family: 'Baloo 2', sans-serif; font-style: normal; border-radius: 999px; clip-path: none; letter-spacing: .08em; }
#breaking .hd { margin-top: 40px; font: italic 800 128px/0.95 'Barlow Condensed', sans-serif; letter-spacing: .01em; text-transform: uppercase; text-shadow: 0 8px 40px rgba(0,0,0,.6); }
html[data-studio="casual"] #breaking .hd { font-family: 'Baloo 2', sans-serif; font-style: normal; font-size: 112px; }
#breaking .bd { margin-top: 30px; font: 600 40px/1.3 'Inter', sans-serif; opacity: .92; }
#breaking .teams { margin-top: 36px; display: flex; justify-content: center; gap: 30px; align-items: center; font: 800 40px 'Barlow Condensed', sans-serif; }
/* Story impact board: one moment, several teams (one or both leagues) */
#breaking.board .hd { margin-top: 26px; font-size: 92px; }
html[data-studio="casual"] #breaking.board .hd { font-size: 84px; }
#breaking.board .bd { margin-top: 18px; font-size: 30px; }
#breaking.board .teams { display: block; margin-top: 26px; font: inherit; }
.impact { display: grid; gap: 10px; width: 1320px; margin: 0 auto; text-align: left; }
.im-row { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 1fr) 300px; gap: 18px; align-items: center; padding: 12px 22px; border-radius: 12px; background: rgba(0,0,0,.42); border-left: 8px solid var(--c); }
.im-row:not(:has(.im-lg)) { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 300px; }
.im-lg { font: 800 18px/1 'Barlow Condensed', sans-serif; letter-spacing: .12em; padding: 7px 10px; border-radius: 5px; background: rgba(255,255,255,.14); }
.im-tm { display: flex; align-items: center; gap: 14px; min-width: 0; font: 800 36px/1 'Barlow Condensed', sans-serif; color: var(--c); }
.im-tm b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.im-tm .ic { width: 46px; height: 46px; flex: none; }
.im-flip { flex: none; font: 800 16px/1 'Inter', sans-serif; font-style: normal; letter-spacing: .08em; padding: 6px 9px; border-radius: 5px; background: var(--c); color: #fff; }
.im-pl { font: 600 24px/1.2 'Inter', sans-serif; opacity: .92; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.im-pl b { color: #7ee2a8; }
.im-wp { display: grid; gap: 6px; font: 700 22px/1 'Inter', sans-serif; text-align: right; }
.im-bar { height: 10px; border-radius: 5px; background: rgba(255,255,255,.15); overflow: hidden; }
.im-bar i { display: block; height: 100%; }
.im-wp .up { color: #7ee2a8; } .im-wp .dn { color: #ff7a7a; }
.im-more { text-align: center; font: 700 24px 'Inter', sans-serif; opacity: .8; padding-top: 4px; }
#breaking.show .impact .im-row { animation: hd .6s ease both; }
#breaking.show .impact .im-row:nth-child(2) { animation-delay: .7s; } #breaking.show .impact .im-row:nth-child(3) { animation-delay: .85s; }
#breaking.show .impact .im-row:nth-child(4) { animation-delay: 1s; } #breaking.show .impact .im-row:nth-child(5) { animation-delay: 1.15s; } #breaking.show .impact .im-row:nth-child(6) { animation-delay: 1.3s; }
#breaking .meter { margin: 30px auto 0; width: 1100px; height: 20px; border-radius: 10px; overflow: hidden; background: rgba(255,255,255,.15); display: flex; }
#breaking .meter i { display: block; height: 100%; transition: width 1.5s cubic-bezier(.2,.8,.2,1); }
#breaking.show .kick { animation: kick .6s cubic-bezier(.2,1.4,.4,1) both; }
#breaking.show .hd { animation: hd .8s .25s cubic-bezier(.2,.9,.2,1) both; }
#breaking.show .bd, #breaking.show .teams, #breaking.show .meter { animation: hd .8s .5s ease both; }
@keyframes kick { from { transform: scale(2.2); opacity: 0; } }
@keyframes hd { from { transform: translateY(50px); opacity: 0; filter: blur(6px); } }
#breaking.out { opacity: 0; transition: opacity .6s ease; }

/* ---- handoff wipe ---- */
#wipe { position: absolute; inset: 0; z-index: 15; pointer-events: none; display: grid; place-items: center; transform: translateX(-110%); background: var(--wipe-bg, #0a4bd6); }
#wipe.go { animation: wipe 2.6s cubic-bezier(.7,0,.3,1) both; }
@keyframes wipe { 0% { transform: translateX(-110%); } 30%, 70% { transform: none; } 100% { transform: translateX(110%); } }
#wipe .w1 { font: italic 800 110px/1 'Barlow Condensed', sans-serif; color: #fff; text-transform: uppercase; letter-spacing: .02em; text-align: center; }
#wipe .w2 { font: 600 36px 'Inter', sans-serif; color: rgba(255,255,255,.9); margin-top: 20px; text-align: center; }

/* ---- shared pieces inside segments ---- */
/* Team logos / emoji are shown as they are -- no circle crop, no ring. Only the
   initials fallback (a team with no logo or emoji) gets a small colored badge. */
.ic { display: inline-grid; place-items: center; width: 1em; height: 1em; vertical-align: -.12em; font-size: 1em; flex: none; }
.ic img { width: 100%; height: 100%; object-fit: contain; }
.ic.ini { color: #fff; font: 800 .45em var(--font-body); border-radius: 50%; overflow: hidden; }
.big-vs { display: grid; grid-template-columns: 1fr 200px 1fr; align-items: center; gap: 20px; }
.tm-big { display: flex; align-items: center; gap: 22px; min-width: 0; }
.tm-big.r { flex-direction: row-reverse; text-align: right; }
.tm-big .ic { font-size: 92px; }
.tm-big .nm { font: var(--head-style) var(--head-weight) 50px/1 var(--font-head); color: var(--c); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.tm-big .sc { font: 800 82px/1 var(--font-head); font-variant-numeric: tabular-nums; margin-top: 6px; }
.tm-big .px { font: 600 18px var(--font-body); color: var(--muted); margin-top: 4px; }
.mid-wp { text-align: center; }
.mid-wp .p { font: 800 74px/1 var(--font-head); }
.mid-wp .l { font: 700 16px var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.wpbar { height: 16px; border-radius: 8px; overflow: hidden; display: flex; background: var(--panel-2); }
.wpbar i { display: block; height: 100%; transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
canvas.chart { width: 100%; display: block; }
.onfield { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; margin-top: 18px; }
.onfield h4 { margin: 0 0 8px; font: 700 15px var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.pl { display: flex; justify-content: space-between; gap: 10px; padding: 7px 12px; border-radius: 8px; background: var(--panel-2); margin-bottom: 6px; font: 600 19px var(--font-body); }
.pl em { font-style: normal; color: var(--muted); font-weight: 600; font-size: 15px; margin-left: 6px; }
.pl .live { color: var(--hot); font-weight: 800; font-size: 13px; letter-spacing: .1em; margin-right: 6px; }
.grid-sb { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.sb { padding: 16px 18px; border-radius: var(--radius); background: var(--panel-2); border: 1px solid var(--line); }
.sb .row { display: flex; align-items: center; gap: 12px; font: 700 25px var(--font-head); margin: 4px 0; }
.sb .row .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb .row .s { font-variant-numeric: tabular-nums; }
.sb .row.lead .n { color: var(--c); }
.sb .meta { display: flex; justify-content: space-between; font: 600 14px var(--font-body); color: var(--muted); margin-top: 8px; letter-spacing: .04em; }
.sb .meta .st-live { color: var(--hot); font-weight: 800; } .sb .meta .st-final { color: var(--fg); font-weight: 800; }
table.st { width: 100%; border-collapse: collapse; font: 600 22px var(--font-body); }
table.st th { text-align: left; font: 700 14px var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 6px 10px; }
table.st td { padding: 8px 10px; border-top: 1px solid var(--line); }
table.st td.num { text-align: right; font-variant-numeric: tabular-nums; }
table.st tr.cut td { border-top: 3px dashed var(--hot); }
table.st .mv-up { color: var(--good); font-weight: 800; } table.st .mv-dn { color: var(--hot); font-weight: 800; }
.players-top { display: grid; grid-template-columns: 1.3fr 1fr; gap: 26px; }
.prow { display: grid; grid-template-columns: 46px 1fr auto; gap: 14px; align-items: center; padding: 10px 14px; border-radius: 10px; background: var(--panel-2); margin-bottom: 10px; }
.prow .rk { font: 800 34px var(--font-head); color: var(--accent); text-align: center; }
.prow b { display: block; font: 700 25px/1.1 var(--font-head); }
.prow span { font: 600 15px var(--font-body); color: var(--muted); }
.prow .pts { font: 800 40px var(--font-head); font-variant-numeric: tabular-nums; }
.callout { padding: 18px 20px; border-radius: var(--radius); background: var(--panel-2); border: 1px solid var(--line); margin-bottom: 16px; }
.callout small { font: 700 13px var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.callout b { display: block; font: 700 30px/1.1 var(--font-head); margin-top: 6px; }
.callout span { display: block; font: 600 18px var(--font-body); color: var(--muted); margin-top: 4px; }
.nflg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.ng { padding: 14px 16px; border-radius: var(--radius); background: var(--panel-2); border: 1px solid var(--line); }
.ng .r { display: flex; align-items: center; gap: 10px; font: 700 26px var(--font-head); margin: 3px 0; }
.ng .r img { width: 34px; height: 34px; }
.ng .r .n { flex: 1; } .ng .r .s { font-variant-numeric: tabular-nums; }
.ng .d { display: flex; justify-content: space-between; font: 600 14px var(--font-body); color: var(--muted); margin-top: 6px; }
.ng.live { border-color: var(--hot); box-shadow: 0 0 0 1px var(--hot) inset; } .ng.live .d b { color: var(--hot); }
.empty-seg { display: grid; place-items: center; height: 100%; text-align: center; font: 700 40px var(--font-head); color: var(--muted); }

/* ---- controls (appear on mouse move) ---- */
#controls { position: fixed; right: 18px; top: 18px; z-index: 50; display: flex; gap: 8px; align-items: center; padding: 8px; border-radius: 12px; background: rgba(0,0,0,.7); color: #fff; font: 600 14px 'Inter', sans-serif; opacity: 0; transition: opacity .3s; }
body.ui #controls, #controls:focus-within { opacity: 1; }
#controls button, #controls select { font: inherit; color: #fff; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
#controls input[type=range] { width: 90px; }
#soundGate { position: fixed; left: 50%; top: 22px; transform: translateX(-50%); z-index: 60; padding: 18px 30px; border-radius: 999px; border: 0; cursor: pointer; font: 800 24px 'Inter', sans-serif; background: #fff; color: #000; box-shadow: 0 10px 40px rgba(0,0,0,.5); animation: pulse 2s infinite; }
@keyframes pulse { 50% { transform: translateX(-50%) scale(1.05); } }
#loading { position: fixed; inset: 0; display: grid; place-items: center; color: #fff; font: 700 28px 'Inter', sans-serif; z-index: 70; background: #000; }
/* ---- holiday sets (season-look.js sets html[data-seasonal-theme]; desk-fx.js sets data-holiday) ---- */
#sl_canvas, #sl_fx, #sl_frost { display: none !important; } /* the site-wide particles; the desk draws its own inside the TV */
#holidayFx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
#top, #stage, #side, #anchor { z-index: 1; }
html[data-holiday="halloween"] { --accent: #ff8a1f; --accent-2: #9b5cff; --hot: #ff5a1f; --bar: linear-gradient(90deg, #2a1240, #6d28d9 45%, #ff8a1f); }
html[data-holiday="thanksgiving"] { --accent: #c9772b; --accent-2: #e8a33d; --bar: linear-gradient(90deg, #7a2e12, #b5441c 50%, #e8a33d); }
html[data-holiday="christmas"] { --accent: #d62828; --accent-2: #18a058; --hot: #d62828; --bar: linear-gradient(90deg, #0b6b3a, #d62828 55%, #f2c14e); }
html[data-holiday="coldsnap"] { --accent: #3b8fd9; --accent-2: #9fd3ff; --bar: linear-gradient(90deg, #12355e, #3b8fd9 55%, #bfe6ff); }
html[data-holiday][data-daypart="night"] #tv { background: radial-gradient(ellipse at 50% -10%, color-mix(in srgb, var(--accent) 35%, #000) 0%, var(--bg) 60%); }

/* ---- headshots ---- */
.hs-sm { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; background: var(--panel); vertical-align: middle; margin-right: 8px; }
.hs-md { width: 58px; height: 58px; border-radius: 50%; object-fit: cover; background: var(--panel); }
.prow { grid-template-columns: 46px 58px 1fr auto; }
.callout b .hs-sm { width: 40px; height: 40px; }
.bk-hs { display: block; width: 240px; height: 175px; object-fit: contain; margin: 26px auto -10px; filter: drop-shadow(0 12px 30px rgba(0,0,0,.6)); }
#alert .ic { width: 86px; height: 86px; font-size: 86px; }
.hs-al { width: 86px; height: 86px; object-fit: cover; background: rgba(255,255,255,.15); }

/* ---- what they need ---- */
.need-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; height: 100%; }
.need { padding: 20px 22px; border-radius: var(--radius); background: var(--panel-2); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 16px; }
.need-head { display: flex; justify-content: space-between; align-items: center; font: var(--head-style) var(--head-weight) 34px/1.05 var(--font-head); }
.need-head .ic { font-size: 44px; }
.need-pct { font: 800 30px var(--font-head); color: var(--muted); }
.need-nums { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.need-nums b { display: block; font: 800 64px/1 var(--font-head); font-variant-numeric: tabular-nums; }
.need-nums small { font: 600 15px var(--font-body); color: var(--muted); }
.need-left .pl { background: var(--panel); }

/* ---- record book ---- */
table.rec td { padding: 9px 10px; font-size: 20px; } table.rec td small { font-size: 14px; }
.rec-foot { margin-top: 12px; font: 600 15px var(--font-body); color: var(--muted); text-align: right; }

/* ---- commercial break ---- */
.ad { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; padding: 0 60px;
  background: repeating-linear-gradient(135deg, transparent 0 40px, color-mix(in srgb, var(--accent) 6%, transparent) 40px 80px); border-radius: var(--radius); }
.ad-k { font: 700 16px var(--font-body); letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
.ad-brand { font: var(--head-style) 800 96px/1 var(--font-head); color: var(--accent); text-shadow: 0 6px 0 color-mix(in srgb, var(--accent) 25%, transparent); }
.ad-tag { font: 700 34px var(--font-head); }
.ad-body { font: 600 27px/1.4 var(--font-body); max-width: 950px; }
.ad-fine { font: 500 14px var(--font-body); color: var(--muted); font-style: italic; margin-top: 10px; }

/* ---- instant replay ---- */
#replay { position: absolute; inset: 0; z-index: 3; background: var(--bg2); display: flex; flex-direction: column; align-items: center; padding: 70px 30px 20px; animation: segIn .5s ease both; }
#replay.out { opacity: 0; transition: opacity .5s; }
#replay .rp-bug { position: absolute; left: 0; right: 0; top: 0; height: 56px; padding: 0 30px; display: flex; align-items: center; background: var(--hot); color: #fff; font: italic 800 30px 'Barlow Condensed', sans-serif; letter-spacing: .12em; animation: blink 1.4s infinite; }
#replay .rp-teams { width: 1150px; display: flex; justify-content: space-between; font: var(--head-style) var(--head-weight) 38px var(--font-head); margin-bottom: 14px; }
#replay .rp-teams b { font-variant-numeric: tabular-nums; }
#replay #rpPct { color: var(--muted); font-size: 28px; }

/* ---- recap show inside the stage ---- */
.recap-cv { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: var(--radius); background: #000; }
#segBody:has(.recap-cv) { inset: 56px 0 0 0; padding: 0; }
.recap-dl { position: absolute; right: 18px; bottom: 16px; z-index: 2; font: 700 16px var(--font-body); padding: 9px 16px; border-radius: 999px; border: 0; background: rgba(0,0,0,.6); color: #fff; cursor: pointer; }

/* ---- head-to-head line (spotlight) ---- */
.h2h { margin-top: 12px; text-align: center; font: 700 17px var(--font-body); color: var(--muted); letter-spacing: .02em; }

/* ---- countdown ---- */
.cd-wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; }
.cd-k { font: 700 22px var(--font-body); letter-spacing: .24em; text-transform: uppercase; color: var(--muted); }
.cd-big { font: var(--head-style) 800 200px/1 var(--font-head); font-variant-numeric: tabular-nums; color: var(--accent); text-shadow: var(--glow); }
.cd-sub { font: 600 26px var(--font-body); }
.cd-games { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 26px; margin-top: 10px; font: 700 26px var(--font-head); }
.cd-games span { display: inline-flex; align-items: center; gap: 8px; } .cd-games img { width: 34px; height: 34px; }

/* ---- picks ---- */
.picks-top { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 18px; }
.pick-big, .ld { padding: 18px 22px; border-radius: var(--radius); background: var(--panel-2); border: 1px solid var(--line); border-left: 8px solid var(--c); }
.pick-big small, .ld small { font: 700 14px var(--font-body); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.pb-row { display: flex; align-items: center; gap: 12px; margin: 8px 0 4px; font: var(--head-style) var(--head-weight) 36px/1.05 var(--font-head); color: var(--c); }
.pb-row .ic { font-size: 42px; }
.pick-big span, .ld span { font: 600 17px var(--font-body); color: var(--muted); }
.picks-list { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }

/* ---- scenarios ---- */
.scn { margin-bottom: 18px; } .scn-h { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; font: var(--head-style) var(--head-weight) 30px var(--font-head); margin-bottom: 10px; }
.scn-h > span:last-child { text-align: right; } .scn-h .ic { font-size: 34px; }
.scn-need { padding: 6px 16px; border-radius: 999px; background: var(--hot); color: #fff; font: 800 20px var(--font-body); font-style: normal; }
.scn-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.sc-p { display: grid; grid-template-columns: auto 1fr 120px auto; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; background: var(--panel-2); margin-bottom: 6px; font: 600 17px var(--font-body); }
.sc-p .live { color: var(--hot); font-weight: 800; font-size: 12px; letter-spacing: .1em; margin-right: 6px; }
.sc-p em { font-style: normal; color: var(--muted); font-size: 14px; } .sc-p b { font-variant-numeric: tabular-nums; }
.sc-bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; } .sc-bar i { display: block; height: 100%; background: var(--accent); }

/* ---- clinch watch ---- */
.cl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 22px; }
.cl { display: grid; grid-template-columns: 1fr auto 60px; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 10px; background: var(--panel-2); border-left: 6px solid var(--muted); font: 600 19px var(--font-body); }
.cl-t em { font-style: normal; color: var(--muted); font-size: 15px; margin-left: 6px; } .cl-o { text-align: right; color: var(--muted); font-weight: 700; }
.cl-s { font: 800 15px var(--font-body); letter-spacing: .06em; text-transform: uppercase; }
.cl.ok { border-left-color: var(--good); } .cl.ok .cl-s { color: var(--good); }
.cl.go { border-left-color: var(--accent); } .cl.go .cl-s { color: var(--accent); }
.cl.warn { border-left-color: #f5a524; } .cl.warn .cl-s { color: #f5a524; }
.cl.out { opacity: .55; border-left-color: var(--hot); } .cl.out .cl-s { color: var(--hot); }

/* ---- news / injuries ---- */
.news-cols { display: grid; grid-template-columns: 1fr 1.2fr; gap: 26px; }
.news-cols h4 { margin: 0 0 10px; font: 700 15px var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.inj { font: 800 13px var(--font-body); letter-spacing: .06em; padding: 4px 10px; border-radius: 999px; background: #f5a524; color: #1a1200; }
.inj-out, .inj-injury_reserve, .inj-suspension { background: var(--hot); color: #fff; } .inj-doubtful { background: #ff7a45; color: #fff; }
.news-it { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--panel-2); margin-bottom: 8px; }
.news-it b { display: block; font: 700 19px/1.25 var(--font-body); } .news-it span { font: 600 14px var(--font-body); color: var(--muted); }

/* ---- transactions ---- */
.tx { display: flex; align-items: center; gap: 16px; padding: 12px 14px; border-radius: 10px; background: var(--panel-2); margin-bottom: 9px; }
.tx b { display: block; font: 700 21px/1.25 var(--font-body); } .tx span { font: 600 14px var(--font-body); color: var(--muted); }
.tx-k { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--good); color: #fff; font: 800 24px var(--font-body); }
.tx-k.tx-trade { background: var(--accent); }

/* ---- stat leaders ---- */
.ld-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.ld-big { font: var(--head-style) 800 54px/1 var(--font-head); margin: 6px 0 4px; font-variant-numeric: tabular-nums; }

/* ---- playoff bracket ---- */
.bk { position: relative; display: flex; gap: 46px; height: 560px; padding: 4px 6px; }
.bk-col { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: 10px; position: relative; z-index: 1; min-width: 0; }
.bk-rd { position: absolute; top: -6px; left: 0; right: 0; text-align: center; font: var(--head-style) var(--head-weight) 22px var(--font-head); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.bk-rd small { display: block; font: 600 12px var(--font-body); letter-spacing: .08em; color: var(--muted); text-transform: none; }
.bk-col { padding-top: 46px; }
.bk-game { position: relative; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); overflow: hidden; }
.bk-game.live { border-color: var(--hot); box-shadow: 0 0 0 1px var(--hot), 0 0 24px color-mix(in srgb, var(--hot) 35%, transparent); }
.bk-live { position: absolute; right: 8px; top: -1px; font: 800 10px var(--font-body); letter-spacing: .1em; color: #fff; background: var(--hot); padding: 2px 7px; border-radius: 0 0 6px 6px; z-index: 2; }
.bk-slot { display: grid; grid-template-columns: 26px 30px 1fr auto; align-items: center; gap: 8px; padding: 8px 12px; font: 700 19px var(--font-head); border-left: 5px solid var(--c, transparent); }
.bk-slot + .bk-slot { border-top: 1px solid var(--line); }
.bk-slot .ic { font-size: 28px; } .bk-seed { font: 800 14px var(--font-body); color: var(--muted); text-align: center; }
.bk-nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .bk-sc { font-variant-numeric: tabular-nums; }
.bk-slot.win { background: color-mix(in srgb, var(--c) 18%, transparent); } .bk-slot.win .bk-nm { color: var(--c); }
.bk-slot.lose { opacity: .45; } .bk-slot.empty { color: var(--muted); border-left-color: var(--line); }
.bk-bye { padding: 6px 12px; font: 600 13px var(--font-body); color: var(--muted); border-top: 1px dashed var(--line); }
.bk-champ { flex: .8; } .bk-trophy { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 18px 10px; border-radius: 14px; background: radial-gradient(circle at 50% 30%, rgba(224,178,61,.28), transparent 70%); border: 2px solid #e0b23d; font: var(--head-style) var(--head-weight) 26px/1.1 var(--font-head); }
.bk-trophy .ic { font-size: 70px; } .bk-cup { font-size: 70px; filter: drop-shadow(0 0 20px rgba(224,178,61,.6)); }
.bk-lines { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.bk-lines path { fill: none; stroke: var(--muted); stroke-width: 2; opacity: .5; }
.bk.proj .bk-game { border-style: dashed; } .bk-note { margin-top: 8px; text-align: center; font: 600 16px var(--font-body); color: var(--muted); }

/* ---- championship: tale of the tape, champion card ---- */
.tt-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 20px; margin-bottom: 14px; }
.tt-head > div { display: flex; align-items: center; gap: 14px; font: var(--head-style) var(--head-weight) 40px/1 var(--font-head); color: var(--c); }
.tt-head > div:last-child { flex-direction: row-reverse; text-align: right; } .tt-head .ic { font-size: 64px; }
.tt-vs { font: italic 800 40px var(--font-head); color: #e0b23d; }
.tt-row { display: grid; grid-template-columns: 1fr 260px 1fr; gap: 16px; align-items: center; padding: 11px 16px; border-radius: 10px; background: var(--panel-2); margin-bottom: 8px; font: 700 22px var(--font-body); }
.tt-row span:last-child { text-align: right; } .tt-row small { text-align: center; font: 700 14px var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.tt-w { color: #e0b23d; } .tt-row:last-of-type span { font-size: 15px; font-weight: 600; }
.tt-h2h { margin-top: 12px; text-align: center; font: 700 17px var(--font-body); color: var(--muted); }
.ch-card { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; background: radial-gradient(ellipse at 50% 20%, color-mix(in srgb, var(--c) 30%, transparent), transparent 65%); border-radius: var(--radius); }
.ch-cup { font-size: 90px; filter: drop-shadow(0 0 30px rgba(224,178,61,.7)); } .ch-logo .ic { font-size: 120px; }
.ch-name { font: var(--head-style) 800 76px/1 var(--font-head); color: var(--c); } .ch-sub { font: 800 26px var(--font-body); letter-spacing: .16em; text-transform: uppercase; color: #e0b23d; }
.ch-path { list-style: none; padding: 0; margin: 10px 0 0; font: 600 20px var(--font-body); } .ch-path li { margin: 4px 0; } .ch-path b { color: var(--muted); margin-right: 8px; font-size: 15px; text-transform: uppercase; letter-spacing: .1em; }
.ch-foot { font: 600 16px var(--font-body); color: var(--muted); margin-top: 6px; }

/* ---- championship look: gold accents + slow beams behind the studio ---- */
html[data-champ="on"] { --accent: #e0b23d; --accent-2: #ffd98a; --bar: linear-gradient(90deg, #6b4a0b, #c99419 45%, #ffd98a); --bar-fg: #1a1200; --glow: 0 0 34px rgba(224,178,61,.35); }
html[data-champ="on"][data-daypart="day"] { --bar-fg: #1a1200; }
html[data-champ="on"] #tv::after { content: ''; position: absolute; inset: -30%; pointer-events: none; z-index: 0; opacity: .35; mix-blend-mode: screen;
  background: repeating-conic-gradient(from 0deg at 50% 0%, rgba(255,217,138,.55) 0deg 4deg, transparent 4deg 24deg); -webkit-mask-image: radial-gradient(ellipse at 50% 0%, #000, transparent 70%); mask-image: radial-gradient(ellipse at 50% 0%, #000, transparent 70%); animation: beamSweep 30s linear infinite; }
@keyframes beamSweep { from { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } to { transform: rotate(-8deg); } }

/* ---- championship takeovers (intro + finale) ---- */
#champFx { position: absolute; inset: 0; z-index: 25; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; color: #fff;
  background: radial-gradient(ellipse at 50% 40%, #2a1d05 0%, #0b0803 60%, #000 100%); overflow: hidden; }
#champFx.show { display: flex; animation: fadeIn .6s ease both; } #champFx.out { opacity: 0; transition: opacity .8s; }
@keyframes fadeIn { from { opacity: 0; } }
.cf-beams { position: absolute; inset: -40%; background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,217,138,.4) 0deg 3deg, transparent 3deg 20deg); -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 60%); mask-image: radial-gradient(circle, #000 0%, transparent 60%); animation: spinSlow 40s linear infinite; z-index: 0; }
@keyframes spinSlow { to { transform: rotate(360deg); } }
#champFx > *:not(.cf-beams):not(canvas) { position: relative; z-index: 2; }
.cf-confetti { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
.cf-k { font: 700 26px 'Inter', sans-serif; letter-spacing: .4em; color: #ffd98a; animation: hd .8s .2s both; }
.cf-title { font: italic 800 190px/0.9 'Barlow Condensed', sans-serif; letter-spacing: .04em; background: linear-gradient(180deg, #fff6d8, #e0b23d 55%, #8a5d0c); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 10px 40px rgba(224,178,61,.45)); animation: kick 1s .4s cubic-bezier(.2,1.3,.4,1) both; }
.cf-title.small { font-size: 86px; }
.cf-teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 60px; width: 1600px; margin-top: 10px; }
.cf-t { display: flex; flex-direction: column; align-items: center; gap: 10px; font: italic 800 58px/1 'Barlow Condensed', sans-serif; color: var(--c); }
.cf-t .ic { font-size: 160px; filter: drop-shadow(0 0 40px color-mix(in srgb, var(--c) 60%, transparent)); } .cf-t small { font: 700 22px 'Inter', sans-serif; color: #ffd98a; letter-spacing: .2em; text-transform: uppercase; }
.cf-t.l { animation: fromL 1s 1.4s cubic-bezier(.2,.9,.2,1) both; } .cf-t.r { animation: fromR 1s 1.4s cubic-bezier(.2,.9,.2,1) both; }
@keyframes fromL { from { transform: translateX(-700px); opacity: 0; } } @keyframes fromR { from { transform: translateX(700px); opacity: 0; } }
.cf-vs { font: italic 800 110px 'Barlow Condensed', sans-serif; color: #e0b23d; animation: kick .7s 2.2s cubic-bezier(.2,1.4,.4,1) both; }
.cf-sub { font: 600 30px 'Inter', sans-serif; color: rgba(255,255,255,.85); animation: hd .8s 2.6s both; }
.cf-cup { font-size: 150px; animation: kick 1s .2s cubic-bezier(.2,1.3,.4,1) both; filter: drop-shadow(0 0 50px rgba(224,178,61,.8)); }
.cf-logo .ic { font-size: 200px; } .cf-logo { animation: hd 1s .6s both; }
.cf-champ { font: italic 800 130px/0.95 'Barlow Condensed', sans-serif; text-shadow: 0 8px 50px rgba(0,0,0,.6); animation: kick 1s 1s cubic-bezier(.2,1.3,.4,1) both; }
#champFx.finale .cf-sub { animation-delay: 1.6s; }

/* ---- season analysis ---- */
.an-2 { display: grid; grid-template-columns: 1.35fr 1fr; gap: 26px; }
.an-2 h4 { margin: 0 0 10px; font: 700 15px var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.an-2 h4 small { text-transform: none; letter-spacing: 0; font-weight: 600; margin-left: 6px; opacity: .8; }
.an-row { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: center; padding: 10px 14px; border-radius: 10px; background: var(--panel-2); margin-bottom: 8px; font: 700 19px var(--font-body); }
.an-row em { display: block; font: 600 14px var(--font-body); font-style: normal; color: var(--muted); margin-top: 2px; }
.an-rk { font: 800 26px var(--font-head); color: var(--accent); text-align: center; }
.an-big { font: var(--head-style) 800 34px var(--font-head); font-variant-numeric: tabular-nums; color: var(--accent); }
.an-foot { margin-top: 8px; font: 600 14px var(--font-body); color: var(--muted); }
.tm { display: grid; gap: 5px; }
.tm-row { display: grid; grid-template-columns: 2.2fr repeat(var(--cols, 6), .8fr) 1.6fr; gap: 8px; align-items: center; padding: 6px 12px; border-radius: 8px; background: var(--panel-2); font: 600 17px var(--font-body); }
.tm-row > span:not(:first-child):not(.tm-id) { text-align: center; font-variant-numeric: tabular-nums; }
.tm-head { background: transparent; font: 700 13px var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tm-lg { background: transparent; color: var(--muted); font-size: 15px; }
.tm-cell.hi { color: var(--good); font-weight: 800; } .tm-cell.lo { color: var(--muted); opacity: .7; }
.tm-id { font: 700 14px var(--font-body); color: var(--accent); }
.iq { display: grid; grid-template-columns: 1.4fr 1fr 60px; gap: 12px; align-items: center; padding: 7px 12px; border-radius: 8px; background: var(--panel-2); margin-bottom: 6px; font: 600 18px var(--font-body); }
.iq > b { text-align: right; font-variant-numeric: tabular-nums; } .iq-bar { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; } .iq-bar i { display: block; height: 100%; }
.trd { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 10px; background: var(--panel-2); margin-bottom: 10px; position: relative; }
.trd-s { display: flex; flex-direction: column; gap: 3px; font: 600 15px var(--font-body); } .trd-s b { font: 700 18px var(--font-body); } .trd-s em { font-style: normal; color: var(--muted); font-size: 14px; }
.trd-s.win em { color: var(--good); font-weight: 800; } .trd-vs { font-size: 26px; color: var(--muted); } .trd small { position: absolute; right: 12px; top: 6px; color: var(--muted); font: 600 12px var(--font-body); }
.rc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; }
.rc { display: grid; grid-template-columns: 74px 1fr; gap: 14px; align-items: center; padding: 8px 14px; border-radius: 10px; background: var(--panel-2); border-left: 6px solid var(--c); }
.rc b { display: block; font: 700 19px var(--font-body); } .rc span { font: 600 14px var(--font-body); color: var(--muted); }
.rc-g { font: var(--head-style) 800 46px/1 var(--font-head); text-align: center; }
.rc-A { color: var(--good); } .rc-B { color: var(--accent); } .rc-C { color: #f5a524; } .rc-D, .rc-F { color: var(--hot); }

/* ---- 3D metallic logos (desk-logo3d.js) ---- */
.logo3d-canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; z-index: 1; pointer-events: none; transition: opacity .3s; }
#logo3d { position: absolute; inset: 0; z-index: 24; display: none; background: radial-gradient(ellipse at 50% 30%, #0b1a3d 0%, #02040c 70%); }
#logo3d.show { display: block; }
#logo3d .l3-text { position: absolute; left: 0; right: 0; bottom: 120px; z-index: 2; text-align: center; color: #fff; text-shadow: 0 6px 30px rgba(0,0,0,.8); }
#logo3d .l3-k { font: 700 24px 'Inter', sans-serif; letter-spacing: .4em; color: #9fc0ff; text-transform: uppercase; animation: hd .8s .6s both; }
#logo3d .l3-t { font: italic 800 84px/1 'Barlow Condensed', sans-serif; letter-spacing: .02em; text-transform: uppercase; margin-top: 10px; animation: hd .8s .9s both; }
/* set cinematics (desk-cine.js) */
.cine { position: absolute; inset: 0; z-index: 1; background: #000; opacity: 0; transition: opacity .45s; pointer-events: none; }
.cine.on { opacity: 1; }
.cine-shot { position: absolute; inset: 0; }
.cine-v { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
.cine-half { position: absolute; top: 0; bottom: 0; width: 50%; overflow: hidden; }
.cine-half.l { left: 0; } .cine-half.r { left: 50%; }
.cine-half .cine-v { width: 200%; } .cine-half.r .cine-v { left: -100%; }
.cine-flash { position: absolute; inset: 0; z-index: 2; background: #fff; opacity: 0; }
.cine-flash.go { animation: cineFlash .28s ease-out; }
@keyframes cineFlash { 0% { opacity: .7; } 100% { opacity: 0; } }
#logo3d .l3-text.swap .l3-t { animation: hd .5s .05s both; } /* caption changes with each camera shot */
#champFx.has3d .cf-t .ic, #champFx.has3d .cf-logo { visibility: hidden; }
#champFx.has3d .cf-beams { opacity: .35; }

/* ---- connection banner ---- */
#netBanner { position: fixed; left: 50%; top: 14px; transform: translate(-50%, -300%); z-index: 80; padding: 10px 22px; border-radius: 999px; background: #c2410c; color: #fff; font: 700 16px 'Inter', sans-serif; transition: transform .4s; }
#netBanner.show { transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .seg-in, #breaking .stripes, #live i { animation: none !important; } }
</style>
