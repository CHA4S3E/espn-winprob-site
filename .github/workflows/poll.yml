name: Poll ESPN win probabilities

on:
  schedule:
    # Every 5 minutes, GitHub's shortest supported interval.
    # Actual runs may lag a few minutes during high platform load,
    # especially Sunday afternoons -- expected and harmless for this chart.
    - cron: '*/5 * * * *'
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: poller
        run: npm ci

      - name: Run poller
        working-directory: poller
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node poll.js
